    const SESSION_KEY = 'klikajar_active_session_v2';
    const PREVIEW_USERS_KEY = 'klikajar_preview_users_v2';

    function syncPreviewUsersStorage() {
      if (!IS_PREVIEW) return;
      try {
        localStorage.setItem(PREVIEW_USERS_KEY, JSON.stringify(state.usersList));
      } catch (e) {}

    function applyGlobalAppThemeClass() {
      const body = document.body;
      if (!body) return;
      body.classList.remove(
        'app-theme-minimalis',
        'app-theme-cyberpunk',
        'app-theme-bento',
        'app-theme-glass',
        'app-theme-interaktif'
      );
      const themeId = state.globalAppTheme || 'bento';
      body.classList.add(`app-theme-${themeId}`);
      if (themeId === 'cyberpunk') {
        state.darkMode = true;
        document.documentElement.classList.add('dark');
      } else if (!state.darkMode) {
        document.documentElement.classList.remove('dark');
      }
    }

    function saveSessionState() {
      try {
        localStorage.setItem('klikajar_global_theme_v1', state.globalAppTheme || 'bento');
        if (state.currentUser) {
          const payload = {
            currentUser: state.currentUser,
            currentView: state.currentView,
            activeMenu: state.activeMenu,
            globalAppTheme: state.globalAppTheme,
            institutionData: state.institutionData,
            adminPaymentConfig: state.adminPaymentConfig
          };
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(payload));
          localStorage.setItem(SESSION_KEY, JSON.stringify(payload));
        } else {
          sessionStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {}
    }

    function restoreSessionState() {
      try {
        const savedTheme = localStorage.getItem('klikajar_global_theme_v1');
        if (savedTheme) {
          state.globalAppTheme = savedTheme;
        }
        if (IS_PREVIEW) {
          const savedUsers = localStorage.getItem(PREVIEW_USERS_KEY);
          if (savedUsers !== null) {
            const parsedUsers = JSON.parse(savedUsers);
            if (Array.isArray(parsedUsers)) {
              state.usersList = parsedUsers;
            }
          }
        }
        const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.currentUser) {
            state.currentUser = parsed.currentUser;
            state.currentView = parsed.currentView || 'app';
            state.activeMenu = parsed.activeMenu || 'dashboard';
            if (parsed.globalAppTheme) {
              state.globalAppTheme = parsed.globalAppTheme;
            }
            if (parsed.institutionData) {
              state.institutionData = { ...state.institutionData, ...parsed.institutionData };
            }
            if (parsed.adminPaymentConfig) {
              state.adminPaymentConfig = { ...state.adminPaymentConfig, ...parsed.adminPaymentConfig };
            }
            state.genForm.namaGuru = parsed.currentUser.namaLengkap || state.genForm.namaGuru;
            syncInstitutionToGenForm();
            applyGlobalAppThemeClass();
            return true;
          }
        }
      } catch (e) {}
      applyGlobalAppThemeClass();
      return false;
    }

    async function initFirebaseIfProduction() {
      if (IS_PREVIEW) return;
      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
        const app = appMod.initializeApp(firebaseConfig);
        fbAuth = authMod.getAuth(app);
        fbDb = fsMod.getFirestore(app);
        fbMod = { ...authMod, ...fsMod };

        fbMod.onAuthStateChanged(fbAuth, async (user) => {
          if (user && state.currentUser && state.currentUser.role === 'admin') {
            await loadFirestoreDataForRole();
            renderApp();
          }
        });

        await loadPublicAdminPaymentConfig();
        if (state.currentUser) {
          await loadFirestoreDataForRole();
          renderApp();
        }
      } catch (err) {
        console.error('Firebase init error:', err);
      }
    }

    async function loadPublicAdminPaymentConfig() {
      if (IS_PREVIEW || !fbDb || !fbMod) return;
      try {
        const snap = await fbMod.getDoc(fbMod.doc(fbDb, 'app_settings', 'admin_payment'));
        if (snap.exists()) {
          state.adminPaymentConfig = { ...state.adminPaymentConfig, ...snap.data() };
        }
        const themeSnap = await fbMod.getDoc(fbMod.doc(fbDb, 'app_settings', 'global_theme'));
        if (themeSnap.exists() && themeSnap.data().themeId) {
          state.globalAppTheme = themeSnap.data().themeId;
          applyGlobalAppThemeClass();
        }
      } catch (err) {}
    }

    async function loadFirestoreDataForRole() {
      if (IS_PREVIEW || !fbDb || !fbMod || !state.currentUser) return;
      try {
        await loadPublicAdminPaymentConfig();
        const docsSnap = await fbMod.getDocs(fbMod.collection(fbDb, 'documents'));
        const allDocs = docsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.documents = state.currentUser.role === 'admin'
          ? allDocs
          : allDocs.filter(d => d.userId === state.currentUser.id);

        if (state.currentUser.role === 'admin') {
          const usersSnap = await fbMod.getDocs(fbMod.collection(fbDb, 'users'));
          state.usersList = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        }

        const annSnap = await fbMod.getDocs(fbMod.collection(fbDb, 'announcements'));
        state.announcements = annSnap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
      } catch (err) {
        console.error('Error memuat data Firestore:', err);
      }
    }

      saveSessionState();

    window.deleteDocument = async (docId) => {
      state.documents = state.documents.filter(d => d.id !== docId);
      if (state.activeDoc && state.activeDoc.id === docId) {
        state.activeDoc = null;
      }
      if (!IS_PREVIEW && fbDb && fbMod) {
        try {
          await fbMod.deleteDoc(fbMod.doc(fbDb, 'documents', docId));
        } catch (err) {}
      }
      showToast('Dokumen dihapus dari arsip.');
      renderApp();
    };

    window.duplicateDocument = (docId) => {
      const orig = getAccessibleDocuments().find(d => d.id === docId);
      if (!orig) return;
      const copy = JSON.parse(JSON.stringify(orig));
      copy.id = 'doc-' + Date.now();
      copy.userId = state.currentUser ? state.currentUser.id : orig.userId;
      copy.judul = orig.judul + ' (Salinan)';
      copy.updatedAt = new Date().toISOString();
      state.documents.unshift(copy);
      showToast('Dokumen berhasil diduplikasi!');
      renderApp();
    };

    window.updateDocTitle = (newTitle) => {
      if (!state.activeDoc) return;
      state.activeDoc.judul = newTitle.trim() || state.activeDoc.judul;
      state.activeDoc.updatedAt = new Date().toISOString();
    };

    window.updateSectionTitle = (secId, newTitle) => {
      if (!state.activeDoc) return;
      const sec = state.activeDoc.sections.find(s => s.id === secId);
      if (sec) sec.title = newTitle.trim();

    window.updateSectionContent = (secId, html) => {
      if (!state.activeDoc) return;

    window.exportDocumentPDF = () => {
      const el = document.getElementById('printable-document-area');
      if (!el || !state.activeDoc) return;
      const isF4 = (state.activeDoc.paperSize || 'a4') === 'f4';
      const isLandscape = (state.activeDoc.paperOrientation || 'portrait') === 'landscape';
      showToast(`Menyiapkan file PDF ${isF4 ? 'F4 (Folio)' : 'A4'} (${isLandscape ? 'Landscape' : 'Portrait'}) siap cetak...`);
      const opt = {
        margin: [25, 25, 25, 30],
        filename: `${state.activeDoc.judul.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },

        jsPDF: { unit: 'mm', format: isF4 ? [215, 330] : 'a4', orientation: isLandscape ? 'landscape' : 'portrait' }

        window.html2pdf().set(opt).from(el).save();

    };

    window.exportDocumentDOCX = () => {
      const el = document.getElementById('printable-document-area');
      if (!el || !state.activeDoc) return;
      const isF4 = (state.activeDoc.paperSize || 'a4') === 'f4';
      const isLandscape = (state.activeDoc.paperOrientation || 'portrait') === 'landscape';
      const pageSizeCss = isLandscape
        ? (isF4 ? '33.0cm 21.5cm landscape' : '29.7cm 21.0cm landscape')
        : (isF4 ? '21.5cm 33.0cm portrait' : '21.0cm 29.7cm portrait');
      const htmlContent = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head><meta charset='utf-8'><title>${state.activeDoc.judul}</title>
        <style>
          @page WordSection1 {
            size: ${pageSizeCss};
            margin: 2.5cm 2.5cm 2.5cm 3.0cm;
            mso-header-margin: 1.2cm;
            mso-footer-margin: 1.2cm;
          }
          div.WordSection1 { page: WordSection1; }
          body { font-family: 'Calibri', 'Arial', sans-serif; font-size: 11.5pt; line-height: 1.5; color: #0F172A; text-align: justify; }
          table { width: 100%; border-collapse: collapse; margin: 12px 0 16px 0; font-size: 10.5pt; }
          tr { page-break-inside: avoid; }
          th, td { border: 1px solid #94A3B8; padding: 8px 11px; vertical-align: top; text-align: left; }
          th { background-color: #1E3A8A; color: #FFFFFF; font-weight: bold; }
          h1 { font-size: 17pt; color: #1E3A8A; text-align: center; font-weight: bold; }
          h2 { font-size: 15pt; font-weight: bold; }
          h3 { font-size: 14pt; color: #1E3A8A; border-bottom: 1.5px solid #D97706; padding-bottom: 5px; margin-top: 18px; text-align: left; font-weight: bold; page-break-after: avoid; }
          h4 { font-size: 12pt; color: #0F766E; margin-top: 12px; text-align: left; font-weight: bold; page-break-after: avoid; }
          .doc-page-break { page-break-before: always; }
          .doc-callout { border-left: 4px solid #D97706; background: #F8FAFC; padding: 12px 15px; margin: 12px 0; }
          .no-print { display: none; }
        </style>
        </head><body><div class="WordSection1">${el.innerHTML}</div></body></html>
      `;
      const blob = new Blob(['\ufeff', htmlContent], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${state.activeDoc.judul.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_${isF4 ? 'F4' : 'A4'}_${isLandscape ? 'Landscape' : 'Portrait'}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Dokumen Word ukuran ${isF4 ? 'F4 (Folio)' : 'A4'} (${isLandscape ? 'Landscape' : 'Portrait'}) berhasil diunduh!`);
    };

    window.printDocumentClean = () => {

      let styleTag = document.getElementById('dynamic-print-page-size');
      if (!styleTag) {
        styleTag = document.createElement('style');

      const sizeStr = isF4

      if (menuId === 'editor') return 'Editor Dokumen & Pratinjau Cetak A4 / F4';
      if (menuId === 'documents') return 'Arsip Perangkat Pembelajaran';
      if (menuId === 'institution') return 'Data Instansi (Diknas / Kemenag) & Identitas Lembaga';
      if (menuId === 'calendar') return 'Kalender Pendidikan Satuan Pendidikan';
      if (menuId === 'templates') return 'Pustaka Template & Desain Dokumen';
      if (menuId === 'users') return 'Kontrol Semua Akun Guru & Konfirmasi Pembayaran';
      if (menuId === 'announcements') return 'Pemberitahuan & Informasi untuk Guru';

                      ${['Problem Based Learning (PBL)', 'Project Based Learning (PjBL)', 'Discovery Learning', 'Inquiry Learning', 'Cooperative Learning', 'Differentiated Instruction'].map(md => `<option value="${md}" ${f.modelPembelajaran === md ? 'selected' : ''}>${md}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Alokasi Waktu</label>
                    <input type="text" value="${f.alokasiWaktu}" oninput="window.updateGenForm('alokasiWaktu', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                </div>

                <div class="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Karakteristik Peserta Didik</label>
                    <textarea rows="2" oninput="window.updateGenForm('karakteristikSiswa', this.value)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">${f.karakteristikSiswa}</textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Sarana dan Prasarana</label>
                    <textarea rows="2" oninput="window.updateGenForm('saranaPrasarana', this.value)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">${f.saranaPrasarana}</textarea>
                  </div>
                </div>

                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 grid sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Tema Dokumen & Palet Warna</label>
                    <select onchange="window.updateGenForm('templateStyle', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-semibold">
                      ${DOC_TEMPLATES.map(t => `<option value="${t.id}" ${f.templateStyle === t.id ? 'selected' : ''}>${t.name}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Gaya Desain (Sesuai Jenjang)</label>
                    <select onchange="window.updateGenForm('designStyle', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-semibold">
                      ${DESIGN_STYLES.map(ds => `<option value="${ds.id}" ${f.designStyle === ds.id ? 'selected' : ''}>${ds.name}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Ukuran Kertas Cetak</label>
                    <select onchange="window.updateGenForm('paperSize', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-semibold">
                      <option value="a4" ${f.paperSize === 'a4' ? 'selected' : ''}>A4 Standar (210 × 297 mm)</option>
                      <option value="f4" ${f.paperSize === 'f4' ? 'selected' : ''}>F4 / Folio (215 × 330 mm)</option>
                    </select>
                  </div>
                </div>

                ${f.kurikulum === 'Kurikulum Berbasis Cinta (Panca Cinta)' ? `
                  <div class="p-4 sm:p-5 rounded-2xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="heart" class="w-4 h-4 text-amber-600"></i>
                        <span class="font-display font-bold text-sm text-slate-900 dark:text-white">Pengaturan Nilai Panca Cinta</span>
                      </div>
                      <select onchange="window.updateGenForm('pancaCintaMode', this.value)" class="px-3 py-1.5 rounded-lg border border-amber-300 dark:border-amber-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                        <option value="otomatis" ${f.pancaCintaMode === 'otomatis' ? 'selected' : ''}>Integrasi Otomatis (Semua 5 Nilai)</option>
                        <option value="manual" ${f.pancaCintaMode === 'manual' ? 'selected' : ''}>Pilih Manual Nilai Panca Cinta</option>
                      </select>
                    </div>

                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2.5 pt-1">
                      ${PANCA_CINTA_ITEMS.map(pc => {
                        const checked = f.pancaCintaMode === 'otomatis' || f.pancaCintaSelected.includes(pc.id);
                        return `
                          <label class="flex items-start gap-2 p-2.5 rounded-xl bg-white dark:bg-darkCard border border-amber-100 dark:border-slate-700 text-xs cursor-pointer">
                            <input type="checkbox" ${checked ? 'checked' : ''} ${f.pancaCintaMode === 'otomatis' ? 'disabled' : ''}
                              onchange="window.togglePancaCintaItem('${pc.id}')" class="mt-0.5 accent-amber-600" />
                            <span><strong>${pc.title}</strong></span>
                          </label>
                        `;
                      }).join('')}
                    </div>
                  </div>
                ` : ''}

                <div class="pt-2 flex flex-wrap items-center gap-3">
                  <button onclick="window.runGenerateDocument()" ${state.isGenerating ? 'disabled' : ''}
                    class="px-7 py-3.5 rounded-2xl bg-emeraldDeep hover:bg-teal-800 text-white font-display font-extrabold text-xs sm:text-sm shadow-lg shadow-emerald-900/20 flex items-center gap-2.5 transition disabled:opacity-60">
                    <i data-lucide="${state.isGenerating ? 'loader-2' : 'sparkles'}" class="w-4 h-4 ${state.isGenerating ? 'animate-spin' : ''}"></i>
                    <span>${state.isGenerating ? 'AI Sedang Menyusun Perangkat...' : 'Generate Perangkat Pembelajaran Sekarang'}</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 3. EDITOR DOKUMEN & PRATINJAU CETAK A4 / F4
      if (m === 'editor') {
        if (!state.activeDoc) {
          return `
            <div class="app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-10 text-center space-y-4">
              <i data-lucide="file-text" class="w-12 h-12 text-slate-300 mx-auto"></i>
              <h3 class="font-display font-bold text-base">Belum Ada Dokumen Aktif di Editor</h3>
              <p class="text-xs text-slate-500 max-w-md mx-auto">Buat perangkat baru melalui Generator atau pilih salah satu dokumen dari arsip tersimpan.</p>
              <div class="flex justify-center gap-3">
                <button onclick="window.setActiveMenu('generator')" class="px-5 py-2.5 rounded-xl bg-emeraldDeep text-white text-xs font-bold">Buka Generator AI</button>
                <button onclick="window.setActiveMenu('documents')" class="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold">Lihat Arsip</button>
              </div>
            </div>
          `;
        }

        const doc = state.activeDoc;
        const logoNaungan = doc.logoNaunganDataUrl || state.institutionData.logoNaunganDataUrl;
        const logoLembaga = doc.logoLembagaDataUrl || state.institutionData.logoLembagaDataUrl;
        const namaInstitusiDoc = doc.namaInstitusi || state.institutionData.namaLembaga;
        const naunganDoc = doc.naungan || state.institutionData.naungan;
        const npsnDoc = doc.npsn || state.institutionData.npsn;
        const nsmDoc = doc.nsm || state.institutionData.nsm;
        const alamatDoc = doc.alamatInstitusi || state.institutionData.alamat;
        const kotaDoc = doc.kotaKabupaten || state.institutionData.kotaKabupaten;
        const tglDoc = formatTanggalIndo(doc.tanggalPenyusunan || state.genForm.tanggalPenyusunan);
        const kepalaDoc = doc.namaKepala || state.institutionData.namaKepala;
        const nipKepalaDoc = doc.nipKepala || state.institutionData.nipKepala;
        const paperSize = doc.paperSize || 'a4';
        const paperOrientation = doc.paperOrientation || 'portrait';
        const designStyle = doc.designStyle || 'style-geometris';

        return `
          <div class="space-y-4">
            <div class="no-print bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex flex-wrap items-center justify-between gap-3 sticky top-16 z-20 shadow-xs">
              <div class="flex flex-wrap items-center gap-2">
                <select onchange="window.changeDocPaperSize(this.value)" title="Ukuran Kertas" class="px-3 py-2 rounded-xl border border-emerald-300 dark:border-teal-700 bg-emerald-50/60 dark:bg-slate-800 text-xs font-extrabold text-emeraldDeep dark:text-teal-300">
                  <option value="a4" ${paperSize === 'a4' ? 'selected' : ''}>Kertas: A4 (210×297mm)</option>
                  <option value="f4" ${paperSize === 'f4' ? 'selected' : ''}>Kertas: F4 / Folio (215×330mm)</option>
                </select>
                <select onchange="window.changeDocOrientation(this.value)" title="Orientasi Halaman (Gunakan Landscape untuk tabel lebar)" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs font-bold">
                  <option value="portrait" ${paperOrientation === 'portrait' ? 'selected' : ''}>Orientasi: Portrait</option>
                  <option value="landscape" ${paperOrientation === 'landscape' ? 'selected' : ''}>Orientasi: Landscape (Tabel Lebar)</option>
                </select>
                <select onchange="window.changeDocTemplate(this.value)" title="Tema Dokumen" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs font-bold">
                  ${DOC_TEMPLATES.map(t => `<option value="${t.id}" ${doc.templateStyle === t.id ? 'selected' : ''}>Tema: ${t.name}</option>`).join('')}
                </select>
                <select onchange="window.changeDocDesignStyle(this.value)" title="Gaya Desain Jenjang" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs font-bold">
                  ${DESIGN_STYLES.map(ds => `<option value="${ds.id}" ${designStyle === ds.id ? 'selected' : ''}>Gaya: ${ds.name.split(' (')[0]}</option>`).join('')}
                </select>
                <button onclick="window.addCustomSection()" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Bagian
                </button>
                <button onclick="window.saveActiveDocChanges()" class="px-3.5 py-2 rounded-xl bg-emeraldDeep text-white text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                </button>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <button onclick="window.exportDocumentDOCX()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Word / DOCX (${paperSize.toUpperCase()})
                </button>
                <button onclick="window.exportDocumentPDF()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="file-down" class="w-3.5 h-3.5"></i> PDF (${paperSize.toUpperCase()})
                </button>
                <button onclick="window.printDocumentClean()" class="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i> Cetak ${paperSize.toUpperCase()}
                </button>
              </div>
            </div>

            <div class="overflow-x-auto pb-8">
              <div id="printable-document-area" class="doc-paper paper-${paperSize} orient-${paperOrientation} ${doc.templateStyle || 'tpl-modern-academic'} ${designStyle}">
                <!-- HALAMAN SAMPUL (COVER) ELEGAN, FORMAL & PROFESIONAL -->
                <div class="doc-cover-page">
                  <div style="width:100%;">
                    <div class="flex items-center justify-center gap-6 mb-4">
                      ${logoNaungan
                        ? `<img src="${logoNaungan}" alt="Logo Instansi" class="h-16 w-16 object-contain" />`
                        : `<div class="w-16 h-16 rounded-xl border border-slate-300 flex items-center justify-center text-[9pt] font-bold text-slate-500 text-center p-1">${naunganDoc === 'Kemenag' ? 'LOGO KEMENAG' : 'LOGO DIKNAS'}</div>`
                      }
                      ${logoLembaga
                        ? `<img src="${logoLembaga}" alt="Logo Lembaga" class="h-16 w-16 object-contain" />`
                        : `<div class="w-16 h-16 rounded-xl border border-slate-300 flex items-center justify-center text-[9pt] font-bold text-slate-500 text-center p-1">LOGO LEMBAGA</div>`
                      }
                    </div>
                    <p class="text-[10.5pt] font-bold uppercase tracking-widest text-slate-600" style="text-align:center; margin-bottom:2px;">
                      ${naunganDoc === 'Kemenag' ? 'KEMENTERIAN AGAMA REPUBLIK INDONESIA' : naunganDoc === 'Diknas' ? 'DINAS PENDIDIKAN / KEMENDIKBUDRISTEK' : 'SATUAN PENDIDIKAN'}
                    </p>
                    <p class="text-[13pt] font-extrabold uppercase text-slate-900" style="text-align:center; margin-bottom:0;">
                      ${namaInstitusiDoc}
                    </p>
                    <p class="text-[9.5pt] text-slate-500" style="text-align:center; margin-top:2px;">
                      NPSN: ${npsnDoc || '-'}${naunganDoc === 'Kemenag' && nsmDoc ? ' • NSM: ' + nsmDoc : ''} • ${alamatDoc || ''}, ${kotaDoc || ''}
                    </p>
                  </div>

                  <div style="width:100%; margin: 16px 0;">
                    <span class="doc-cover-badge">DOKUMEN PERANGKAT PEMBELAJARAN RESMI</span>
                    <h1 contenteditable="true" onblur="window.updateDocTitle(this.innerText)" class="doc-cover-title outline-none focus:ring-2 focus:ring-emerald-400 rounded px-2">
                      ${doc.judul}
                    </h1>
                    <p class="doc-cover-subtitle">
                      ${doc.kurikulum} • Mata Pelajaran ${doc.mataPelajaran}
                    </p>
                  </div>

                  <div class="doc-cover-meta-box">
                    <table>
                      <tr><td width="36%"><strong>Jenis Perangkat</strong></td><td width="4%">:</td><td width="60%">${doc.jenisLabel}</td></tr>
                      <tr><td><strong>Jenjang / Fase / Kelas</strong></td><td>:</td><td>${doc.jenjang} / ${doc.fase} / Kelas ${doc.kelas}</td></tr>
                      <tr><td><strong>Semester / Tahun Ajaran</strong></td><td>:</td><td>${doc.semester} / ${doc.tahunAjaran}</td></tr>
                      <tr><td><strong>Materi Pokok</strong></td><td>:</td><td>${doc.materiPokok}</td></tr>
                      <tr><td><strong>Guru Penyusun</strong></td><td>:</td><td>${doc.namaGuru || state.genForm.namaGuru}</td></tr>
                      <tr><td><strong>NIP / NUPTK</strong></td><td>:</td><td>${doc.nipGuru || user?.nip || '-'}</td></tr>
                    </table>
                  </div>

                  <div style="width:100%;">
                    <p class="text-[11pt] font-bold text-slate-800 uppercase" style="text-align:center; margin-bottom:2px;">
                      ${namaInstitusiDoc}
                    </p>
                    <p class="text-[10pt] text-slate-600" style="text-align:center; margin-bottom:0;">
                      ${kotaDoc || '[Kota/Kabupaten]'} • Tahun Ajaran ${doc.tahunAjaran}
                    </p>
                  </div>
                </div>

                <!-- RUNNING HEADER HALAMAN ISI -->
                <div class="doc-running-header">
                  <span><strong>${doc.jenisLabel.toUpperCase()}</strong> — ${doc.mataPelajaran} (${doc.jenjang} / Kelas ${doc.kelas})</span>
                  <span>${namaInstitusiDoc} • ${doc.tahunAjaran}</span>
                </div>

                <!-- KOP SURAT & JUDUL HALAMAN PERTAMA ISI -->
                <div class="doc-banner mb-5">
                  <div class="flex items-center justify-between gap-4">
                    <div class="w-16 h-16 shrink-0 flex items-center justify-center">
                      ${logoNaungan
                        ? `<img src="${logoNaungan}" alt="Logo Instansi" class="max-h-16 max-w-16 object-contain" />`
                        : `<div class="w-14 h-14 rounded-xl border border-current/25 flex items-center justify-center text-[9px] font-bold text-center p-1 opacity-70">${naunganDoc === 'Kemenag' ? 'LOGO KEMENAG' : 'LOGO DIKNAS'}</div>`
                      }
                    </div>

                    <div class="flex-1 text-center">
                      <p class="text-[10px] uppercase tracking-wider font-bold opacity-85" style="margin-bottom:2px; text-align:center;">
                        ${naunganDoc === 'Kemenag' ? 'KEMENTERIAN AGAMA REPUBLIK INDONESIA' : naunganDoc === 'Diknas' ? 'DINAS PENDIDIKAN / KEMENDIKBUDRISTEK' : 'SATUAN PENDIDIKAN'}
                      </p>
                      <h2 contenteditable="true" class="doc-heading text-base font-extrabold uppercase tracking-tight leading-snug" style="text-align:center;">
                        ${namaInstitusiDoc}
                      </h2>
                      <p class="text-[10px] opacity-90" style="margin-bottom:4px; text-align:center;">
                        NPSN: ${npsnDoc || '-'}${naunganDoc === 'Kemenag' && nsmDoc ? ' • NSM: ' + nsmDoc : ''} • ${alamatDoc || ''}, ${kotaDoc || ''}
                      </p>
                      <div class="mt-2 pt-2 border-t border-current/20">
                        <p class="text-[10px] uppercase tracking-widest font-bold opacity-80" style="margin-bottom:2px; text-align:center;">${doc.jenisLabel.toUpperCase()} — ${doc.kurikulum}</p>
                        <h1 contenteditable="true" onblur="window.updateDocTitle(this.innerText)" class="doc-heading mt-0.5 outline-none focus:ring-2 focus:ring-emerald-400 rounded px-1">
                          ${doc.judul}
                        </h1>
                        <p class="text-[11px] mt-0.5 opacity-90" style="margin-bottom:0; text-align:center;">
                          ${doc.jenjang} • ${doc.fase} • Kelas ${doc.kelas} • Semester ${doc.semester} (${doc.tahunAjaran})
                        </p>
                      </div>
                    </div>

                    <div class="w-16 h-16 shrink-0 flex items-center justify-center">
                      ${logoLembaga
                        ? `<img src="${logoLembaga}" alt="Logo Lembaga" class="max-h-16 max-w-16 object-contain" />`
                        : `<div class="w-14 h-14 rounded-xl border border-current/25 flex items-center justify-center text-[9px] font-bold text-center p-1 opacity-70">LOGO LEMBAGA</div>`
                      }
                    </div>
                  </div>
                </div>

                <!-- KONTEN PERANGKAT PEMBELAJARAN -->
                <div class="space-y-4">
                  ${doc.sections.map(sec => `
                    <div class="doc-section-block group relative ${sec.pageBreakBefore ? 'doc-page-break' : ''}">
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <h3 contenteditable="true" onblur="window.updateSectionTitle('${sec.id}', this.innerText)"
                          class="doc-heading doc-section-title outline-none focus:bg-emerald-50 rounded px-1">
                          ${sec.title}
                        </h3>
                        <button onclick="window.removeSection('${sec.id}')" title="Hapus Bagian"
                          class="no-print opacity-0 group-hover:opacity-100 text-[10px] text-rose-500 hover:underline px-2 py-0.5">
                          Hapus
                        </button>
                      </div>
                      <div contenteditable="true" onblur="window.updateSectionContent('${sec.id}', this.innerHTML)"
                        class="outline-none focus:ring-1 focus:ring-emerald-300 rounded p-1">
                        ${sec.content}
                      </div>
                    </div>
                  `).join('')}
                </div>

                <!-- BLOK PENGESAHAN TANDA TANGAN RESMI -->
                <div class="doc-signature-block mt-8 pt-5 border-t border-slate-200 grid grid-cols-2 gap-8 text-xs">
                  <div>
                    <p style="margin-bottom:2px; text-align:left;">Mengetahui,</p>
                    <p style="margin-bottom:2px; text-align:left;">Kepala Sekolah / Madrasah</p>
                    <div class="h-16"></div>
                    <p class="font-bold underline" style="margin-bottom:2px; text-align:left;" contenteditable="true">${kepalaDoc || '......................................................'}</p>
                    <p style="margin-bottom:0; text-align:left;" contenteditable="true">NIP. ${nipKepalaDoc || '...........................................'}</p>
                  </div>
                  <div>
                    <p style="margin-bottom:2px; text-align:left;" contenteditable="true">${kotaDoc || '....................'}, ${tglDoc || '....................'}</p>
                    <p style="margin-bottom:2px; text-align:left;">Guru Mata Pelajaran</p>
                    <div class="h-16"></div>
                    <p class="font-bold underline" style="margin-bottom:2px; text-align:left;" contenteditable="true">${doc.namaGuru || state.genForm.namaGuru}</p>
                    <p style="margin-bottom:0; text-align:left;" contenteditable="true">NIP. ${doc.nipGuru || user?.nip || '...........................................'}</p>
                  </div>
                </div>

                <!-- RUNNING FOOTER & NOMOR HALAMAN -->
                <div class="doc-running-footer">
                  <span>Perangkat Pembelajaran Resmi • ${namaInstitusiDoc} (${paperSize.toUpperCase()})</span>
                  <span class="doc-page-number"></span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 4. ARSIP PERANGKAT TERSIMPAN
      if (m === 'documents') {
        const filtered = docs.filter(d => {
          const matchSearch = !state.searchQuery ||
            d.judul.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
            d.mataPelajaran.toLowerCase().includes(state.searchQuery.toLowerCase());
          const matchType = state.docFilterType === 'all' || d.jenisPerangkat === state.docFilterType;
          return matchSearch && matchType;
        });

        return `
          <div class="space-y-5">
            <div class="app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex flex-col sm:flex-row gap-3 justify-between">
              <input type="text" value="${state.searchQuery}" oninput="state.searchQuery = this.value; window.renderApp();"
                placeholder="Cari judul perangkat atau mata pelajaran..."
                class="flex-1 px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs" />
              <select onchange="state.docFilterType = this.value; window.renderApp();"
                class="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs font-semibold">
                <option value="all">Semua Jenis Perangkat</option>
                ${DEVICE_TYPES.map(d => `<option value="${d.id}" ${state.docFilterType === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
              </select>
            </div>

            ${filtered.length === 0 ? `
              <div class="app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-10 text-center text-xs text-slate-500">
                Tidak ada dokumen yang sesuai filter saat ini.
              </div>
            ` : `
              <div class="grid md:grid-cols-2 gap-4">
                ${filtered.map(d => `

                        <label class="block font-bold mb-1">Password Baru untuk ${modal.user.namaLengkap} *</label>
                        <input type="text" name="newPassword" required placeholder="Masukkan password baru"
                          class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 font-mono" />
                      </div>
                    ` : `
                      <div class="grid sm:grid-cols-2 gap-3">
                        <div>
                          <label class="block font-bold mb-1">Nama Lengkap & Gelar *</label>
                          <input type="text" name="namaLengkap" value="${modal.user.namaLengkap || ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                        </div>
                        <div>
                          <label class="block font-bold mb-1">NIP / NUPTK</label>
                          <input type="text" name="nip" value="${modal.user.nip || ''}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                        </div>
                      </div>
                      <div class="grid sm:grid-cols-2 gap-3">
                        <div>
                          <label class="block font-bold mb-1">No. WhatsApp</label>
                          <input type="text" name="noWhatsapp" value="${modal.user.noWhatsapp || ''}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                        </div>
                        <div>
                          <label class="block font-bold mb-1">Sekolah / Madrasah</label>
                          <input type="text" name="namaInstitusi" value="${modal.user.namaInstitusi || ''}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                        </div>
                      </div>
                      <div class="grid sm:grid-cols-2 gap-3">
                        <div>
                          <label class="block font-bold mb-1">Jenjang</label>
                          <select name="jenjangDefault" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800">
                            ${JENJANG_LIST.map(j => `<option value="${j}" ${modal.user.jenjangDefault === j ? 'selected' : ''}>${j}</option>`).join('')}
                          </select>
                        </div>
                        <div>
                          <label class="block font-bold mb-1">Mata Pelajaran</label>
                          <input type="text" name="mataPelajaran" value="${modal.user.mataPelajaran || ''}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                        </div>
                      </div>
                      <div class="grid sm:grid-cols-3 gap-3">
                        <div>
                          <label class="block font-bold mb-1">Username *</label>
                          <input type="text" name="username" value="${modal.user.username || ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 font-mono" />
                        </div>
                        <div>
                          <label class="block font-bold mb-1">Password *</label>
                          <input type="text" name="password" value="${modal.user.password || ''}" required class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 font-mono" />
                        </div>
                        <div>
                          <label class="block font-bold mb-1">Status Akun</label>
                          <select name="status" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800">
                            <option value="active" ${modal.user.status === 'active' ? 'selected' : ''}>Aktif</option>
                            <option value="pending" ${modal.user.status === 'pending' ? 'selected' : ''}>Menunggu Konfirmasi</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label class="block font-bold mb-1">Keterangan / Bukti Pembayaran</label>
                        <input type="text" name="buktiPembayaran" value="${modal.user.buktiPembayaran || ''}" class="w-full px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                      </div>
                    `}
                    <div class="flex justify-end gap-2 pt-3 border-t border-slate-200 dark:border-slate-700">
                      <button type="button" onclick="window.closeAdminUserModal()" class="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 font-bold">Batal</button>
                      <button type="submit" class="px-5 py-2 rounded-xl bg-emeraldDeep text-white font-bold">Simpan</button>
                    </div>
                  </form>
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      // 7B. ADMIN: KELOLA PEMBERITAHUAN & INFORMASI UNTUK GURU
      if (m === 'announcements' && isAdmin) {
        return `
          <div class="max-w-4xl space-y-6">
            <div class="app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 shadow-xs">
              <div class="border-b border-slate-200 dark:border-slate-700 pb-4 mb-5">
                <h3 class="font-display font-extrabold text-base text-slate-900 dark:text-white">Kirim Pemberitahuan / Informasi ke Seluruh Guru</h3>
                <p class="text-xs text-slate-500 mt-1">Pemberitahuan yang diterbitkan akan langsung tampil pada Dashboard dan lonceng notifikasi seluruh akun Guru.</p>
              </div>

              <form onsubmit="window.createAnnouncement(event)" class="space-y-4 text-xs">
                <div class="grid sm:grid-cols-3 gap-4">
                  <div class="sm:col-span-2">
                    <label class="block font-bold mb-1">Judul Pemberitahuan *</label>
                    <input type="text" name="judul" required placeholder="Contoh: Pembaruan Template Modul Ajar & Jadwal Pemeliharaan"
                      class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 font-semibold" />
                  </div>
                  <div>
                    <label class="block font-bold mb-1">Kategori Informasi</label>
                    <select name="kategori" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800">
                      <option value="Info Penting">Info Penting</option>
                      <option value="Pembaruan Fitur">Pembaruan Fitur</option>
                      <option value="Panduan Kurikulum">Panduan Kurikulum</option>
                      <option value="Jadwal & Administrasi">Jadwal & Administrasi</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label class="block font-bold mb-1">Isi Pemberitahuan Lengkap *</label>
                  <textarea name="isi" rows="3" required placeholder="Tuliskan informasi, pengumuman, atau arahan untuk Bapak/Ibu Guru..."
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800"></textarea>
                </div>

                <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
                  <label class="inline-flex items-center gap-2 cursor-pointer font-semibold text-slate-700 dark:text-slate-300">
                    <input type="checkbox" name="isPinned" class="accent-emeraldDeep rounded" />
                    <span>Sematkan di urutan paling atas (Pin Pengumuman)</span>
                  </label>
                  <button type="submit" class="px-6 py-2.5 rounded-xl bg-emeraldDeep hover:bg-teal-800 text-white font-display font-bold shadow-sm flex items-center gap-2">
                    <i data-lucide="send" class="w-3.5 h-3.5"></i>
                    <span>Terbitkan ke Semua Guru</span>
                  </button>
                </div>
              </form>
            </div>

            <div class="app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
              <h4 class="font-display font-bold text-sm text-slate-900 dark:text-white">Daftar Pemberitahuan Aktif (${state.announcements.length})</h4>
              ${state.announcements.length === 0 ? `
                <p class="text-xs text-slate-500 py-6 text-center">Belum ada pemberitahuan yang diterbitkan.</p>
              ` : `
                <div class="space-y-3">
                  ${state.announcements.map(ann => `
                    <div class="p-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-bgLight dark:bg-slate-800 flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                      <div class="space-y-1">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-mintSoft text-emeraldDeep">${ann.kategori}</span>
                          ${ann.isPinned ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">📌 Disematkan</span>` : ''}
                          <span class="text-[11px] text-slate-400">• ${ann.createdAt} oleh ${ann.author}</span>
                        </div>
                        <h5 class="font-display font-bold text-sm text-slate-900 dark:text-white">${ann.judul}</h5>
                        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">${ann.isi}</p>
                      </div>
                      <div class="flex sm:flex-col gap-1.5 shrink-0 text-xs">
                        <button onclick="window.togglePinAnnouncement('${ann.id}')" class="px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 font-bold">
                          ${ann.isPinned ? 'Lepas Pin' : 'Sematkan'}
                        </button>
                        <button onclick="window.deleteAnnouncement('${ann.id}')" class="px-3 py-1.5 rounded-lg text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 font-bold">
                          Hapus
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      }

      // 8. ADMIN: PROFIL ADMIN & PENGATURAN PEMBAYARAN
      if (m === 'admin-profile' && isAdmin) {
        const pay = state.adminPaymentConfig;
        return `
          <div class="max-w-3xl app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 space-y-5">
            <div>
              <h3 class="font-display font-extrabold text-base">Profil Admin & Informasi Pembayaran (Tampil di Halaman Daftar)</h3>
              <p class="text-xs text-slate-500 mt-1">Data di bawah ini ditampilkan secara langsung kepada calon pendaftar akun Guru baru di halaman pendaftaran.</p>
            </div>
            <form onsubmit="window.saveAdminPaymentConfig(event)" class="space-y-4 text-xs">
              <div class="grid sm:grid-cols-2 gap-4">
                <div>
                  <label class="block font-bold mb-1">Nama Admin *</label>
                  <input type="text" name="namaAdmin" value="${pay.namaAdmin}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                </div>
                <div>
                  <label class="block font-bold mb-1">No. WhatsApp Konfirmasi (Format 628...) *</label>
                  <input type="text" name="noWhatsapp" value="${pay.noWhatsapp}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                </div>
              </div>
              <div class="grid sm:grid-cols-3 gap-4">
                <div>
                  <label class="block font-bold mb-1">Nama Bank *</label>
                  <input type="text" name="namaBank" value="${pay.namaBank}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                </div>
                <div>
                  <label class="block font-bold mb-1">No. Rekening *</label>
                  <input type="text" name="noRekening" value="${pay.noRekening}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                </div>
                <div>
                  <label class="block font-bold mb-1">Atas Nama Bank *</label>
                  <input type="text" name="atasNamaBank" value="${pay.atasNamaBank}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
                </div>
              </div>
              <div>
                <label class="block font-bold mb-1">Nominal / Paket Berlangganan *</label>
                <input type="text" name="nominalPaket" value="${pay.nominalPaket}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
              </div>
              <div>
                <label class="block font-bold mb-1">Keterangan Pembayaran (Tampil di Halaman Daftar) *</label>
                <textarea name="keteranganPembayaran" rows="3" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800">${pay.keteranganPembayaran}</textarea>
              </div>
              <button type="submit" class="px-6 py-3 rounded-xl bg-emeraldDeep text-white font-bold">Simpan Profil Admin & Info Pembayaran</button>
            </form>
          </div>
        `;
      }

      // 8B. ADMIN: TEMA APLIKASI GLOBAL
      if (m === 'app-theme' && isAdmin) {
        return `
          <div class="max-w-5xl space-y-6">
            <div class="app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 shadow-xs">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 dark:border-slate-700 pb-4 mb-6">
                <div>
                  <h3 class="font-display text-lg font-extrabold text-slate-900 dark:text-white">Pengaturan Tema Tampilan Aplikasi Global</h3>
                  <p class="text-xs text-slate-500 mt-1">Tema yang Anda pilih di sini akan otomatis diterapkan ke ruang kerja Anda dan <strong>seluruh akun Guru</strong> agar tampilan konsisten, nyaman dibaca, dan responsif.</p>
                </div>
                <span class="px-3 py-1.5 rounded-full bg-mintSoft text-emeraldDeep text-xs font-extrabold self-start">
                  Aktif: ${APP_THEMES.find(t => t.id === state.globalAppTheme)?.name || 'Bento Grid'}
                </span>
              </div>

              <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                ${APP_THEMES.map(theme => {
                  const isSelected = state.globalAppTheme === theme.id;
                  return `
                    <div class="p-5 rounded-2xl border-2 transition flex flex-col justify-between gap-4 ${isSelected ? 'border-emeraldDeep bg-emerald-50/50 dark:bg-teal-950/40 shadow-md' : 'border-slate-200 dark:border-slate-700 bg-bgLight dark:bg-slate-800/70'}">
                      <div class="space-y-2">
                        <div class="flex items-center justify-between gap-2">
                          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${isSelected ? 'bg-emeraldDeep text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">
                            ${theme.tag}
                          </span>
                          ${isSelected ? `<span class="text-xs font-extrabold text-emeraldDeep dark:text-teal-400">✓ Aktif</span>` : ''}
                        </div>
                        <h4 class="font-display font-extrabold text-sm text-slate-900 dark:text-white">${theme.name}</h4>
                        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">${theme.desc}</p>
                      </div>

                      <button type="button" onclick="window.setGlobalAppTheme('${theme.id}')"
                        class="w-full py-2.5 px-4 rounded-xl text-xs font-display font-bold transition ${isSelected ? 'bg-emeraldDeep text-white' : 'bg-white dark:bg-darkCard border border-slate-300 dark:border-slate-600 hover:border-emeraldDeep text-slate-800 dark:text-white'}">
                        ${isSelected ? 'Sedang Digunakan' : 'Terapkan ke Semua Akun'}
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="mt-6 p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 grid sm:grid-cols-3 gap-4 text-xs">
                <div>
                  <p class="font-bold text-slate-900 dark:text-white">✓ Konsistensi Visual</p>
                  <p class="text-slate-500 mt-0.5">Menyamakan warna utama, tipografi, dan sudut kartu di seluruh halaman Admin & Guru.</p>
                </div>
                <div>
                  <p class="font-bold text-slate-900 dark:text-white">✓ Keterbacaan & Kontras</p>
                  <p class="text-slate-500 mt-0.5">Kontras teks terkalibrasi agar mudah dibaca di laptop, tablet, maupun ponsel.</p>
                </div>
                <div>
                  <p class="font-bold text-slate-900 dark:text-white">✓ Responsif & Ringan</p>
                  <p class="text-slate-500 mt-0.5">Transisi CSS murni tanpa beban skrip tambahan sehingga waktu muat tetap cepat.</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 9. PROFIL GURU
      if (m === 'profile') {
        return `
          <div class="max-w-2xl app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-5">
            <h3 class="font-display font-extrabold text-base">Profil Guru Penyusun</h3>
            <form onsubmit="window.saveProfileSettings(event)" class="space-y-4 text-xs">
              <div>
                <label class="block font-bold mb-1">Nama Lengkap & Gelar</label>
                <input type="text" name="namaLengkap" value="${user?.namaLengkap || ''}" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
              </div>
              <div>
                <label class="block font-bold mb-1">NIP / NUPTK</label>
                <input type="text" name="nip" value="${user?.nip || ''}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
              </div>
              <div class="flex flex-wrap gap-3 pt-2">
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-emeraldDeep text-white font-bold">Simpan Profil</button>
                <button type="button" onclick="window.setActiveMenu('institution')" class="px-5 py-2.5 rounded-xl border border-emeraldDeep text-emeraldDeep font-bold">Kelola Data Sekolah/Madrasah & Logo →</button>
              </div>
            </form>
          </div>
        `;
      }

      // 10. PENGATURAN AI
      return `
        <div class="max-w-2xl app-card bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-5">
          <div>
            <h3 class="font-display font-extrabold text-base">Konfigurasi AI Provider & Preferensi Sistem</h3>
            <p class="text-xs text-slate-500 mt-1">API Key disimpan aman hanya di memori sesi browser Anda dan tidak pernah disimpan di kode publik.</p>
          </div>
          <form onsubmit="window.saveAiSettings(event)" class="space-y-4 text-xs">
            <div>
              <label class="block font-bold mb-1">AI Provider</label>
              <select name="provider" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800">
                <option value="Builtin Pedagogical Engine (Tanpa API Key)" ${state.aiSettings.provider.includes('Builtin') ? 'selected' : ''}>Builtin Pedagogical Engine (Langsung Aktif)</option>
                <option value="Google Gemini API (BYOK)" ${state.aiSettings.provider.includes('Gemini') ? 'selected' : ''}>Google Gemini API (BYOK)</option>
                <option value="OpenAI Compatible API (BYOK)" ${state.aiSettings.provider.includes('OpenAI') ? 'selected' : ''}>OpenAI Compatible API (BYOK)</option>
              </select>
            </div>
            <div>
              <label class="block font-bold mb-1">API Key Opsional (BYOK)</label>
              <input type="password" name="apiKey" value="${state.aiSettings.apiKey}" placeholder="Kosongkan jika menggunakan mesin bawaan KlikAjar" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800" />
            </div>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-emeraldDeep text-white font-bold">Simpan Konfigurasi AI</button>
          </form>
        </div>
      `;
    }

    // =========================================================================
    // RENDER ROOT & BOOTSTRAP APLIKASI
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('klikajar-root');
      if (!root) return;

      let content = '';
      if (state.currentView === 'landing') {
        content = renderLandingPage();
      } else if (state.currentView === 'login' || state.currentView === 'register') {
        content = renderAuthPage(state.currentView);
      } else {
        if (!state.currentUser) {
          state.currentView = 'login';
          content = renderAuthPage('login');
        } else {
          content = renderWorkspace();
        }
      }

      const toastHTML = state.toastMessage ? `
        <div class="fixed bottom-5 right-5 z-[99999] max-w-sm px-4 py-3 rounded-2xl shadow-xl text-xs font-bold text-white flex items-center gap-2.5
          ${state.toastMessage.type === 'error' ? 'bg-rose-600' : 'bg-emeraldDeep'}">
          <i data-lucide="${state.toastMessage.type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i>
          <span>${state.toastMessage.msg}</span>
        </div>
      ` : '';

      root.innerHTML = content + toastHTML;

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    window.state = state;
    window.renderApp = renderApp;

    window.addEventListener('storage', (e) => {
      if (e.key === 'klikajar_global_theme_v1' && e.newValue) {
        state.globalAppTheme = e.newValue;
        applyGlobalAppThemeClass();
        renderApp();
      }
    });

    restoreSessionState();
    applyGlobalAppThemeClass();
    initFirebaseIfProduction();
    renderApp();
  </script>
</body>
</html>
