    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatWaLink(rawPhone, messageText = "") {
      let digits = String(rawPhone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.startsWith("0")) {
        digits = "62" + digits.slice(1);
      } else if (!digits.startsWith("62")) {
        digits = "62" + digits;
      }
      const queryMsg = messageText ? `?text=${encodeURIComponent(messageText)}` : "";
      return `https://wa.me/${digits}${queryMsg}`;
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const badgeColors = {
        success: "border-l-4 border-emerald-500 text-slate-800",
        error: "border-l-4 border-rose-500 text-slate-800",
        info: "border-l-4 border-[#5B5CE6] text-slate-800"
      };
      const iconNames = {
        success: "check-circle-2",
        error: "alert-circle",
        info: "info"
      };
      const iconColors = {
        success: "text-emerald-500",
        error: "text-rose-500",
        info: "text-[#5B5CE6]"
      };

      const toast = document.createElement("div");
      toast.className = `neu-surface pointer-events-auto rounded-2xl px-4 py-3 text-xs font-bold shadow-lg flex items-center gap-2.5 transition-all duration-300 ${badgeColors[type] || badgeColors.info}`;
      toast.innerHTML = `
        <i data-lucide="${iconNames[type] || "info"}" class="w-4 h-4 shrink-0 ${iconColors[type] || "text-[#5B5CE6]"}"></i>
        <span class="leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      if (window.lucide) {
        window.lucide.createIcons();
      }

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-6px)";
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, 3500);
    }

    function processImageUpload(file, maxWidth, maxHeight, callback) {
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        showToast("File yang dipilih harus berupa gambar (PNG/JPG/WEBP).", "error");
        return;
      }
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > maxWidth || h > maxHeight) {
            const ratio = Math.min(maxWidth / w, maxHeight / h);
            w = Math.round(w * ratio);
            h = Math.round(h * ratio);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.clearRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/png");
          if (typeof callback === "function") callback(dataUrl);
        };
        img.onerror = () => {
          showToast("Gagal memproses gambar yang diunggah.", "error");
        };
        img.src = e.target.result;
      };
      reader.onerror = () => {
        showToast("Gagal membaca file gambar.", "error");
      };
      reader.readAsDataURL(file);
    }

    function parseHashParams() {
      const raw = (window.location.hash || "").replace(/^#/, "");
      const params = new URLSearchParams(raw);
      return {
        track: params.get("track"),
        role: params.get("role"),
        user: params.get("user"),
        menu: params.get("menu")
      };
    }

    function syncSessionToHash() {
      try {
        const params = new URLSearchParams();
        if (state.selectedTrack) params.set("track", state.selectedTrack);
        if (state.user) {
          params.set("role", state.user.role);
          params.set("user", state.user.username);
          if (state.activeMenu) params.set("menu", state.activeMenu);
        }
        const serialized = params.toString();
        if (serialized) {
          window.location.hash = serialized;
        }
      } catch (e) {
        // Abaikan jika lingkungan iframe membatasi perubahan hash
      }
    }

    function clearSessionHash() {
      try {
        if (window.location.hash) {
          history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      } catch (e) {
        try {
          window.location.hash = "";
        } catch (_) {}
      }
    }

            (g) => g.username.toLowerCase() === saved.user.toLowerCase() && g.status_aktif !== false && g.status_akun !== "PENDING"
          );
          if (found) {
            state.user = {
              role: "GURU",
              username: found.username,
              nama: found.nama_lengkap,
              nip: found.nip || "",
              jenjang: found.jenjang || "MI",
              jenis_guru: found.jenis_guru || "Guru Mapel"
            };
            state.userNip = found.nip || "";
            state.genForm.nip_penyusun = found.nip || "";
            state.genForm.jenjang = state.user.jenjang;
            state.genForm.jenis_guru = state.user.jenis_guru;
            state.genForm.peran_guru = [state.user.jenis_guru === "Guru Kelas" ? "Guru Kelas" : "Guru Mata Pelajaran"];
            if (!state.selectedTrack) state.selectedTrack = "KURMER";
          } else {
            clearSessionHash();
          }
        }
        renderApp();
        return;
      }

      // Mode Produksi: Pulihkan sesi Guru langsung dari verifikasi Firestore
      // (Sesi Admin dipulihkan otomatis oleh listener onAuthStateChanged di initFirebaseAndListeners)
      if (!IS_PREVIEW) {
        loadPublicMadrasahAndAdminInfo();
      }
      if (saved.role === "GURU" && saved.user) {
        state.restoringSession = true;
        renderApp();
        try {
          if (!db) initFirebaseAndListeners();
          const q = query(collection(db, "guru_users"), where("username", "==", saved.user.toLowerCase()));
          const snap = await getDocs(q);
          if (!snap.empty) {
            const gDoc = snap.docs[0];
            const gData = gDoc.data();
            if (gData.status_aktif !== false && gData.status_akun !== "PENDING") {
              state.user = {
                role: "GURU",
                id: gDoc.id,
                username: gData.username,
                nama: gData.nama_lengkap,
                nip: gData.nip || "",
                jenjang: gData.jenjang || "MI",
                jenis_guru: gData.jenis_guru || "Guru Mapel"
              };
              state.userNip = gData.nip || "";
              state.genForm.nip_penyusun = gData.nip || "";
              state.genForm.jenjang = state.user.jenjang;
              state.genForm.jenis_guru = state.user.jenis_guru;
              state.genForm.peran_guru = [state.user.jenis_guru === "Guru Kelas" ? "Guru Kelas" : "Guru Mata Pelajaran"];
              if (!state.selectedTrack) state.selectedTrack = "KURMER";
            } else {
              clearSessionHash();
            }
          } else {
            clearSessionHash();
          }
        } catch (err) {
          console.warn("Gagal memulihkan sesi guru:", err.message);
        } finally {
          state.restoringSession = false;
          renderApp();
        }
      }
    }

    // INISIALISASI FIREBASE & SINKRONISASI REAL-TIME (SAAT IS_PREVIEW === false)
    // =========================================================================
    async function loadPublicMadrasahAndAdminInfo() {
      if (IS_PREVIEW) return;
      try {
        if (!db) {
          app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);
        }
        const snap = await getDoc(doc(db, "pengaturan_madrasah", "profil_utama"));
        if (snap.exists()) {
          const data = snap.data();
          state.madrasah = { ...state.madrasah, ...data };
          if (data.admin_profile) {
            state.adminProfile = { ...state.adminProfile, ...data.admin_profile };
          }
          renderApp();
        }
      } catch (err) {
        console.warn("Gagal memuat info publik madrasah & admin:", err.message);
      }

    function initFirebaseAndListeners() {
      if (IS_PREVIEW) return;
      try {
        if (!app) {
          app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);
        }

        if (!unsubMadrasah) {
          unsubMadrasah = onSnapshot(doc(db, "pengaturan_madrasah", "profil_utama"), (snap) => {
            if (snap.exists()) {
              const data = snap.data();
              state.madrasah = { ...state.madrasah, ...data };
              if (data.admin_profile) {
                state.adminProfile = { ...state.adminProfile, ...data.admin_profile };
              }
              state.firestoreLastSync = new Date().toLocaleTimeString("id-ID");
              renderApp();
            }
          });
        }

        if (!unsubPerangkat) {
          unsubPerangkat = onSnapshot(collection(db, "perangkat_ajar"), (snap) => {
            const items = [];
            snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
            state.perangkatList = items;
            state.firestoreLastSync = new Date().toLocaleTimeString("id-ID");
            renderApp();
          });
        }

        if (!unsubGuru) {
          unsubGuru = onSnapshot(collection(db, "guru_users"), (snap) => {
            const list = [];
            snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
            state.guruList = list;
            state.firestoreLastSync = new Date().toLocaleTimeString("id-ID");
            renderApp();
          });
        }

        onAuthStateChanged(auth, (firebaseUser) => {
          if (firebaseUser) {
            const saved = parseHashParams();
            state.user = {
              role: "ADMIN",
              uid: firebaseUser.uid,
              username: firebaseUser.email || "admin@madrasah.sch.id",
              nama: state.adminProfile?.nama_admin || "Administrator Madrasah",
              jenjang: "MA"
            };
            if (!state.selectedTrack) {
              state.selectedTrack = saved.track === "KBC" ? "KBC" : "KURMER";
            }
            if (saved.menu) {
              state.activeMenu = saved.menu;
            }
            syncSessionToHash();
            renderApp();
          }
        });
      } catch (err) {
        console.error("Firebase Init Error:", err);
      }
    }

    async function manualSyncFirestore() {
      if (IS_PREVIEW) {
        state.firestoreLastSync = new Date().toLocaleTimeString("id-ID");
        showToast("Mode Preview aktif (data lokal in-memory).", "info");
        renderApp();
        return;
      }
      try {
        if (!db) initFirebaseAndListeners();
        const [pSnap, gSnap, mSnap] = await Promise.all([
          getDocs(collection(db, "perangkat_ajar")),
          getDocs(collection(db, "guru_users")),
          getDoc(doc(db, "pengaturan_madrasah", "profil_utama"))
        ]);
        state.perangkatList = pSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.guruList = gSnap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (mSnap.exists()) {
          const mData = mSnap.data();
          state.madrasah = { ...state.madrasah, ...mData };
          if (mData.admin_profile) {
            state.adminProfile = { ...state.adminProfile, ...mData.admin_profile };
          }
        }
        state.firestoreLastSync = new Date().toLocaleTimeString("id-ID");
        showToast("Data Firestore berhasil dimuat ulang!", "success");
        renderApp();
      } catch (err) {
        showToast("Gagal sinkronisasi Firestore: " + err.message, "error");
      }
    }

    // AUTENTIKASI HYBRID (GURU LOGIN, PENDAFTARAN GURU, & ADMIN LOGIN)
    // =========================================================================
    async function handleGuruLogin(usernameInput, passwordInput) {
      const uname = (usernameInput || "").trim().toLowerCase();
      const pass = (passwordInput || "").trim();
      if (!uname || !pass) {
        showToast("Masukkan username dan kata sandi.", "error");
        return;
      }

      state.authLoading = true;
      renderApp();

      try {
        let matchedGuru = null;
        if (IS_PREVIEW) {
          matchedGuru = state.guruList.find((g) => (g.username || "").toLowerCase() === uname);
        } else {
          if (!db) initFirebaseAndListeners();
          const q = query(collection(db, "guru_users"), where("username", "==", uname));
          const snap = await getDocs(q);
          if (!snap.empty) {
            const d = snap.docs[0];
            matchedGuru = { id: d.id, ...d.data() };
          }
        }

        if (!matchedGuru) {
          throw new Error("Akun guru tidak ditemukan. Silakan daftar terlebih dahulu.");
        }
        if (matchedGuru.password !== pass) {
          throw new Error("Kata sandi yang Anda masukkan salah.");
        }
        if (matchedGuru.status_akun === "PENDING" || matchedGuru.status_aktif === false) {
          throw new Error("Akun Anda berstatus PENDING / belum di-Approve Admin. Silakan hubungi WhatsApp Admin.");
        }

        state.user = {
          role: "GURU",
          id: matchedGuru.id,
          username: matchedGuru.username,
          nama: matchedGuru.nama_lengkap,
          nip: matchedGuru.nip || "",
          jenjang: matchedGuru.jenjang || "MI",
          jenis_guru: matchedGuru.jenis_guru || "Guru Mapel"
        };
        state.userNip = matchedGuru.nip || "";
        state.genForm.nip_penyusun = matchedGuru.nip || "";
        state.genForm.jenjang = state.user.jenjang;
        state.genForm.jenis_guru = state.user.jenis_guru;
        state.genForm.peran_guru = [state.user.jenis_guru === "Guru Kelas" ? "Guru Kelas" : "Guru Mata Pelajaran"];
        state.activeMenu = "dashboard";
        syncSessionToHash();
        showToast(`Selamat datang, ${state.user.nama}!`, "success");
      } catch (err) {
        showToast(err.message || "Gagal masuk sebagai Guru.", "error");
      } finally {
        state.authLoading = false;
        renderApp();
      }
    }

    async function handleAdminLogin(emailInput, passwordInput) {
      const email = (emailInput || "").trim();
      const pass = (passwordInput || "").trim();
      if (!email || !pass) {
        showToast("Masukkan email dan password Admin.", "error");
        return;

      state.authLoading = true;

        if (IS_PREVIEW) {

              role: "ADMIN",
              username: email,
              nama: state.adminProfile?.nama_admin || "Administrator Madrasah",

            showToast("Berhasil masuk sebagai Administrator (Mode Preview).", "success");

    async function handleGuruRegister(formData) {
      const nama = (formData.nama_lengkap || "").trim();
      const username = (formData.username || "").trim().toLowerCase();
      const password = (formData.password || "").trim();
      const jenjang = formData.jenjang || "MI";
      const jenis_guru = formData.jenis_guru || "Guru Mapel";
      const nip = (formData.nip || "").trim();
      const mapel_utama = (formData.mapel_utama || "").trim();

      if (!nama || username.length < 4 || password.length < 4) {
        showToast("Nama lengkap wajib diisi, serta username & sandi minimal 4 karakter.", "error");
        return;
      }

      state.authLoading = true;
      renderApp();

      try {
        if (IS_PREVIEW) {
          if (state.guruList.some((g) => (g.username || "").toLowerCase() === username)) {
            throw new Error("Username sudah terdaftar. Silakan gunakan username lain.");
          }
          state.guruList.unshift({
            id: "guru-" + Date.now(),
            nama_lengkap: nama,
            username,
            password,
            jenjang,
            jenis_guru,
            nip,
            mapel_utama,
            bukti_pembayaran_url: state.regBuktiPembayaranUrl || "",
            status_akun: "PENDING",
            status_aktif: false
          });
        } else {
          if (!db) initFirebaseAndListeners();
          const qCheck = query(collection(db, "guru_users"), where("username", "==", username));
          const snapCheck = await getDocs(qCheck);
          if (!snapCheck.empty) {
            throw new Error("Username sudah digunakan oleh akun lain.");
          }
          await addDoc(collection(db, "guru_users"), {
            nama_lengkap: nama,
            username,
            password,
            jenjang,
            jenis_guru,
            nip,
            mapel_utama,
            bukti_pembayaran_url: state.regBuktiPembayaranUrl || "",
            status_akun: "PENDING",
            status_aktif: false,
            created_at: serverTimestamp()
          });
        }
        state.regBuktiPembayaranUrl = "";
        state.loginTab = "GURU";
        showToast("Pendaftaran berhasil! Silakan konfirmasi ke WhatsApp Admin agar akun segera di-Approve.", "success");
      } catch (err) {
        showToast("Pendaftaran gagal: " + (err.message || "Terjadi kesalahan."), "error");
      } finally {
        state.authLoading = false;
        renderApp();
      }
    }

    // SIMPAN, ARSIPKAN & HAPUS DOKUMEN (TERISOLASI PER AKUN)
    // =========================================================================
    async function saveDocumentToStore(docObj) {
      if (!docObj) return;
      try {
        const payload = {
          ...docObj,
          author_username: state.user?.username || docObj.author_username || "guru.madrasah",
          author_nama: state.user?.nama || docObj.author_nama || "Guru Madrasah",
          is_archived: Boolean(docObj.is_archived)
        };

        if (IS_PREVIEW) {
          const idx = state.perangkatList.findIndex((x) => x.id === payload.id);
          if (idx !== -1) {
            state.perangkatList[idx] = payload;
          } else {
            state.perangkatList.unshift(payload);
          }
          showToast("Berkas perangkat ajar berhasil disimpan ke akun Anda (Mode Preview)!", "success");
          renderApp();
        } else {
          if (!db) initFirebaseAndListeners();
          const { id, ...cleanData } = payload;
          if (id && !id.startsWith("doc-")) {
            await setDoc(doc(db, "perangkat_ajar", id), { ...cleanData, updated_at: serverTimestamp() }, { merge: true });
          } else {
            const added = await addDoc(collection(db, "perangkat_ajar"), { ...cleanData, created_at: serverTimestamp() });
            state.generatedDoc.id = added.id;
          }
          showToast("Berkas perangkat ajar berhasil disimpan ke Cloud Firestore!", "success");
        }
      } catch (err) {
        showToast("Gagal menyimpan berkas: " + err.message, "error");
      }
    }

    async function toggleArchiveDocument(docId, nextArchiveState) {
      try {
        if (IS_PREVIEW) {
          const target = state.perangkatList.find((x) => x.id === docId);
          if (target) target.is_archived = nextArchiveState;
          showToast(nextArchiveState ? "Berkas dipindahkan ke folder Arsip." : "Berkas dipulihkan ke daftar Aktif.", "success");
          renderApp();
        } else {
          await updateDoc(doc(db, "perangkat_ajar", docId), { is_archived: nextArchiveState });
          showToast(nextArchiveState ? "Berkas diarsipkan di Firestore." : "Berkas dipulihkan dari arsip.", "success");
        }
      } catch (err) {
        showToast("Gagal mengubah status arsip: " + err.message, "error");
      }
    }

    async function deleteDocumentFromStore(docId) {
      try {
        if (IS_PREVIEW) {
          state.perangkatList = state.perangkatList.filter((x) => x.id !== docId);
          state.confirmDeleteDocId = null;
          if (state.generatedDoc?.id === docId) state.generatedDoc = null;
          showToast("Berkas perangkat ajar dihapus.", "info");
          renderApp();
        } else {
          await deleteDoc(doc(db, "perangkat_ajar", docId));
          state.confirmDeleteDocId = null;
          if (state.generatedDoc?.id === docId) state.generatedDoc = null;
          showToast("Berkas dihapus dari Cloud Firestore.", "info");
        }
      } catch (err) {
        showToast("Gagal menghapus berkas: " + err.message, "error");
      }
    }

    // =========================================================================
    // FUNGSI EKSPOR WORD (.DOC), PRINT PDF, & POWERPOINT (.PPTX)
    // =========================================================================
    function exportDocumentToWord() {
      const d = state.generatedDoc;
      if (!d) return;
      const contentHTML = buildOfficialDocumentHTML(d);
      const isLandscape = state.paperOrientation === "landscape";
      const pageSizeCss = state.paperSize === "F4"
        ? (isLandscape ? "330mm 215mm" : "215mm 330mm")
        : (isLandscape ? "297mm 210mm" : "210mm 297mm");

      const fullWordDoc = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office'
              xmlns:w='urn:schemas-microsoft-com:office:word'
              xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
          <meta charset="utf-8" />
          <title>${escapeHtml(d.topik_materi || "Perangkat Pembelajaran")}</title>
          <style>
            @page WordSection1 {
              size: ${pageSizeCss};
              margin: 15mm 18mm 15mm 18mm;
            }
            div.WordSection1 { page: WordSection1; }
            body { font-family: 'Times New Roman', serif; font-size: 11pt; color: #111827; line-height: 1.45; }
            .doc-section-title { font-weight: bold; font-size: 11pt; margin-top: 12px; margin-bottom: 5px; text-transform: uppercase; }
            .doc-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 10.5pt; }
            .doc-table th, .doc-table td { border: 1px solid #1F2937; padding: 6px 8px; vertical-align: top; text-align: left; }
            .doc-table th { background-color: #F3F4F6; font-weight: bold; }
          </style>
        </head>
        <body>
          <div class="WordSection1">${contentHTML}</div>
        </body>
        </html>
      `;

      const blob = new Blob(["\ufeff", fullWordDoc], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const safeName = (d.topik_materi || "Perangkat_Ajar").replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 45);
      a.href = url;
      a.download = `${d.jenjang}_${safeName}.doc`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("File Microsoft Word (.doc) berhasil diunduh!", "success");
    }

    function printDocumentToPDF() {
      const styleTag = document.getElementById("dynamic-print-style");
      if (styleTag) {
        const sizeRule = state.paperSize === "F4"
          ? `215mm 330mm ${state.paperOrientation}`
          : `A4 ${state.paperOrientation}`;
        styleTag.textContent = `@page { size: ${sizeRule}; margin: 12mm 15mm; }`;
      }
      window.print();
    }

    async function exportPresentationToPPTX() {
      const d = state.generatedDoc;
      if (!d) return;
      if (typeof window.PptxGenJS === "undefined") {
        showToast("Library PptxGenJS belum siap. Periksa koneksi internet Anda.", "error");
        return;
      }

      try {
        const pptx = new window.PptxGenJS();
        pptx.layout = "LAYOUT_16x9";
        pptx.author = d.author_nama || "KlikAjar";
        pptx.title = d.topik_materi || "Presentasi Pembelajaran";

        const isKBC = d.jalur_kurikulum === "KBC";
        const primaryHex = isKBC ? "0D9488" : "5B5CE6";
        const slides = d.slides || buildSlideDeckFromDoc(d);

        slides.forEach((sl, idx) => {
          const slide = pptx.addSlide();
          if (idx === 0) {
            slide.background = { color: primaryHex };
            slide.addText(`SLIDE ${sl.nomor} • ${sl.subjudul}`, {
              x: 0.6, y: 0.7, w: 8.8, h: 0.4, fontSize: 12, bold: true, color: "E0E7FF"
            });
            slide.addText(sl.judul, {
              x: 0.6, y: 1.3, w: 8.8, h: 1.6, fontSize: 28, bold: true, color: "FFFFFF"
            });
            const bulletItems = (sl.poin || []).map((p) => ({ text: p, options: { bullet: true, color: "F8FAFC", fontSize: 15 } }));
            slide.addText(bulletItems, { x: 0.6, y: 3.1, w: 8.8, h: 1.8 });
          } else {
            slide.background = { color: "F8FAFC" };
            slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: "100%", h: 0.14, fill: { color: primaryHex } });
            slide.addText(`SLIDE ${sl.nomor} / ${slides.length}  |  ${sl.subjudul}`, {
              x: 0.6, y: 0.35, w: 8.8, h: 0.35, fontSize: 11, bold: true, color: primaryHex
            });
            slide.addText(sl.judul, {
              x: 0.6, y: 0.75, w: 8.8, h: 0.7, fontSize: 22, bold: true, color: "1E293B"
            });
            const bulletItems = (sl.poin || []).map((p) => ({
              text: p,
              options: { bullet: true, color: "334155", fontSize: 15, breakLine: true }
            }));
            slide.addText(bulletItems, { x: 0.6, y: 1.65, w: 8.8, h: 3.2, valign: "top" });
            slide.addText(`${state.madrasah.nama_madrasah || "KlikAjar"} — ${d.mata_pelajaran} (${d.jenjang})`, {
              x: 0.6, y: 5.15, w: 8.8, h: 0.3, fontSize: 10, color: "94A3B8"
            });
          }
        });

        const safeName = (d.topik_materi || "Slide_Materi").replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 40);
        await pptx.writeFile({ fileName: `PPT_${d.jenjang}_${safeName}.pptx` });
        showToast("File PowerPoint (.pptx) berhasil diunduh!", "success");
      } catch (err) {
        showToast("Gagal membuat file PPTX: " + err.message, "error");
      }
    }

    // =========================================================================
    // VIEW 3: ARSIP PERANGKAT PEMBELAJARAN (TERISOLASI PER AKUN + FOLDER ARSIP)
    // =========================================================================
    function renderArsipView() {
      const isAdmin = state.user?.role === "ADMIN";
      const accessibleDocs = getAccessiblePerangkatList();
      const activeCount = accessibleDocs.filter((d) => !d.is_archived).length;
      const archivedCount = accessibleDocs.filter((d) => d.is_archived).length;

      const q = (state.arsipSearch || "").toLowerCase();
      const filtered = accessibleDocs.filter((d) => {
        const matchStatus = state.arsipFilterStatus === "ALL"
          ? true
          : state.arsipFilterStatus === "ARCHIVED"
          ? Boolean(d.is_archived)
          : !d.is_archived;
        const matchJenjang = state.arsipFilterJenjang === "ALL" || d.jenjang === state.arsipFilterJenjang;
        const matchTrack = state.arsipFilterTrack === "ALL" || d.jalur_kurikulum === state.arsipFilterTrack;
        const docJenisGuru = d.jenis_guru || ((d.peran_guru || []).includes("Guru Kelas") ? "Guru Kelas" : "Guru Mapel");
        const matchJenisGuru = state.arsipFilterJenisGuru === "ALL" || docJenisGuru === state.arsipFilterJenisGuru;
        const matchQuery = !q ||
          (d.topik_materi || "").toLowerCase().includes(q) ||
          (d.mata_pelajaran || "").toLowerCase().includes(q) ||
          (d.author_nama || "").toLowerCase().includes(q);
        return matchStatus && matchJenjang && matchTrack && matchJenisGuru && matchQuery;
      });

      return `
        <div class="space-y-5">
          <div class="neu-card rounded-3xl p-5 sm:p-6 space-y-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h2 class="text-base sm:text-lg font-extrabold text-slate-800">
                  ${isAdmin ? "Ruang Berkas & Arsip Seluruh Guru" : "Ruang Berkas & Arsip Pribadi Anda"}
                </h2>
                <p class="text-xs text-slate-400">
                  ${isAdmin
                    ? `Menampilkan ${filtered.length} dari ${accessibleDocs.length} total perangkat ajar`
                    : `Berkas terisolasi khusus akun ${escapeHtml(state.user?.nama || "")} (${accessibleDocs.length} berkas)`}
                </p>
              </div>

              <!-- Tab Status Berkas: Berkas Aktif / Diarsipkan / Semua -->
              <div class="neu-inset p-1 rounded-2xl flex items-center gap-1 self-start">
                <button type="button" onclick="window.__setArsipFilter('arsipFilterStatus', 'ACTIVE')"
                  class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${state.arsipFilterStatus === 'ACTIVE' ? 'neu-surface text-[#5B5CE6]' : 'text-slate-500'}">
                  Aktif (${activeCount})
                </button>
                <button type="button" onclick="window.__setArsipFilter('arsipFilterStatus', 'ARCHIVED')"
                  class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${state.arsipFilterStatus === 'ARCHIVED' ? 'neu-surface text-amber-600' : 'text-slate-500'}">
                  Diarsipkan (${archivedCount})
                </button>
                <button type="button" onclick="window.__setArsipFilter('arsipFilterStatus', 'ALL')"
                  class="px-3 py-1.5 rounded-xl text-xs font-extrabold ${state.arsipFilterStatus === 'ALL' ? 'neu-surface text-slate-800' : 'text-slate-500'}">
                  Semua (${accessibleDocs.length})
                </button>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2.5 pt-2 border-t border-slate-200/70">
              <input type="text" value="${escapeHtml(state.arsipSearch)}"
                oninput="window.__setArsipSearch(this.value)"
                placeholder="Cari topik, mapel${isAdmin ? ', atau nama guru' : ''}..."
                class="neu-input rounded-xl px-3.5 py-2 text-xs text-slate-800 flex-1 min-w-[200px]" />

              <select onchange="window.__setArsipFilter('arsipFilterJenjang', this.value)"
                class="neu-input rounded-xl px-3 py-2 text-xs font-bold text-slate-700">
                <option value="ALL" ${state.arsipFilterJenjang === "ALL" ? "selected" : ""}>Semua Jenjang</option>
                <option value="RA" ${state.arsipFilterJenjang === "RA" ? "selected" : ""}>RA</option>
                <option value="MI" ${state.arsipFilterJenjang === "MI" ? "selected" : ""}>MI</option>
                <option value="MTs" ${state.arsipFilterJenjang === "MTs" ? "selected" : ""}>MTs</option>
                <option value="MA" ${state.arsipFilterJenjang === "MA" ? "selected" : ""}>MA</option>
              </select>

              <select onchange="window.__setArsipFilter('arsipFilterTrack', this.value)"
                class="neu-input rounded-xl px-3 py-2 text-xs font-bold text-slate-700">
                <option value="ALL" ${state.arsipFilterTrack === "ALL" ? "selected" : ""}>Semua Kurikulum</option>
                <option value="KURMER" ${state.arsipFilterTrack === "KURMER" ? "selected" : ""}>Kurmer</option>
                <option value="KBC" ${state.arsipFilterTrack === "KBC" ? "selected" : ""}>KBC</option>

                class="neu-input rounded-xl px-3 py-2 text-xs font-bold text-slate-700">
                <option value="ALL" ${state.arsipFilterJenisGuru === "ALL" ? "selected" : ""}>Guru Mapel & Kelas</option>

                <option value="Guru Kelas" ${state.arsipFilterJenisGuru === "Guru Kelas" ? "selected" : ""}>Guru Kelas</option>
              </select>

          </div>

          ${filtered.length === 0 ? `
            <div class="neu-card rounded-3xl p-10 text-center text-xs text-slate-400">
              Tidak ada berkas perangkat pembelajaran pada kategori/filter ini.

          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${filtered.map((item) => {

                return `
                <div class="neu-card rounded-3xl p-5 flex flex-col justify-between gap-4">
                  <div>
                    <div class="flex flex-wrap items-center gap-2 mb-2">
                      <span class="px-2.5 py-0.5 rounded-md text-[10px] font-extrabold ${item.jalur_kurikulum === 'KBC' ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-[#5B5CE6]'}">
                        ${escapeHtml(item.jalur_kurikulum || "KURMER")}
                      </span>
                      <span class="px-2.5 py-0.5 rounded-md text-[10px] font-extrabold ${itemJenisGuru === 'Guru Kelas' ? 'bg-teal-100 text-teal-700' : 'bg-purple-100 text-purple-700'}">
                        ${escapeHtml(itemJenisGuru)}

        if (typeof value === "string" && value.startsWith("data:image/")) {
          return `[Base64 Image Data - ${Math.round(value.length / 1024)} KB]`;
        }
        return value;
      }, 2);
    }

      const ta = document.createElement("textarea");
      ta.value = rek;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("Nomor rekening (" + rek + ") berhasil disalin!", "success");

        showToast("Gagal menyalin nomor rekening.", "error");

          descEl.textContent = matched.deskripsi;

    window.__toggleArrayField = (field, itemVal) => {
      const arr = state.genForm[field] || [];
      if (arr.includes(itemVal)) {
        state.genForm[field] = arr.filter((x) => x !== itemVal);

    };

    window.__selectReferensiJenjang = (jenjangKey) => {
      state.referensiJenjang = jenjangKey;
      renderApp();
    };

    window.__applyReferensiToGenerator = (jenjangKey, idx) => {
      const refItem = CP_REFERENSI_BANK[jenjangKey]?.[idx];
      if (!refItem) return;
      window.__onJenjangChange(jenjangKey);
      state.genForm.capaian_pembelajaran = refItem.cp;
      state.activeMenu = "generator";
      syncSessionToHash();
      showToast("Capaian Pembelajaran berhasil disalin ke formulir Generator!", "success");
      renderApp();
    };

    window.__setFirestoreTab = (tabName) => {
      state.firestoreTab = tabName;
      state.firestoreInspectJson = null;
      renderApp();
    };

    window.__syncFirestoreNow = () => {
      manualSyncFirestore();
    };

    window.__inspectFirestoreDoc = (colName, docId) => {
      let targetObj = null;
      if (colName === "perangkat_ajar") {
        targetObj = state.perangkatList.find((x) => x.id === docId) || null;
      } else if (colName === "guru_users") {
        targetObj = state.guruList.find((x) => x.id === docId) || null;
      } else if (colName === "pengaturan_madrasah") {
        targetObj = state.madrasah;
      }
      if (!targetObj) {
        showToast("Dokumen tidak ditemukan.", "error");
        return;
      }
      state.firestoreInspectJson = {
        path: `/${colName}/${docId}`,
        content: formatFirestoreJsonSafe(targetObj)
      };
      renderApp();
    };

    window.__copyFirestoreJson = () => {
      const pre = document.getElementById("firestore-json-pre");
      if (!pre) return;
      const ta = document.createElement("textarea");
      ta.value = pre.textContent || "";
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("JSON Firestore berhasil disalin ke clipboard!", "success");
      } catch (e) {
        showToast("Gagal menyalin JSON.", "error");
      }
      document.body.removeChild(ta);
    };

    window.__closeFirestoreJson = () => {
      state.firestoreInspectJson = null;
      renderApp();
    };

    window.__openPendingGuru = () => {
      state.guruFilterStatus = "PENDING";
      state.activeMenu = "guru";
      syncSessionToHash();
      renderApp();
    };

    window.__setGuruFilter = (statusVal) => {
      state.guruFilterStatus = statusVal;
      renderApp();
    };

    window.__setGuruSearch = (val) => {
      state.guruSearch = val;
      renderApp();
    };

    window.__toggleShowGuruPassword = (guruId) => {
      state.visiblePasswordIds[guruId] = !state.visiblePasswordIds[guruId];
      renderApp();
    };

    window.__approveGuru = async (guruId) => {
      try {
        if (IS_PREVIEW) {
          const g = state.guruList.find((x) => x.id === guruId);
          if (g) {
            g.status_akun = "APPROVED";
            g.status_aktif = true;
          }
          showToast("Akun guru berhasil di-Approve dan aktif digunakan!", "success");
          renderApp();
        } else {
          await updateDoc(doc(db, "guru_users", guruId), {
            status_akun: "APPROVED",
            status_aktif: true
          });
          showToast("Pendaftar akun guru berhasil disetujui (Approved)!", "success");
        }
      } catch (err) {
        showToast("Gagal menyetujui akun guru: " + err.message, "error");
      }
    };

    window.__openResetPassword = (guruId) => {
      state.resetPasswordGuruId = guruId;
      renderApp();
    };

    window.__cancelResetPassword = () => {
      state.resetPasswordGuruId = null;
      renderApp();
    };

    window.__submitResetPassword = async (guruId) => {
      const inputEl = document.getElementById(`reset-pass-input-${guruId}`);
      const newPass = (inputEl?.value || "").trim();
      if (newPass.length < 4) {
        showToast("Kata sandi baru minimal 4 karakter.", "error");
        return;
      }
      try {
        if (IS_PREVIEW) {
          const g = state.guruList.find((x) => x.id === guruId);
          if (g) g.password = newPass;
          state.resetPasswordGuruId = null;
          state.visiblePasswordIds[guruId] = true;
          showToast("Kata sandi guru berhasil direset (Mode Preview).", "success");
          renderApp();
        } else {
          await updateDoc(doc(db, "guru_users", guruId), { password: newPass });
          state.resetPasswordGuruId = null;
          state.visiblePasswordIds[guruId] = true;
          showToast("Kata sandi guru berhasil direset di Firestore!", "success");
          renderApp();
        }
      } catch (err) {
        showToast("Gagal mereset kata sandi: " + err.message, "error");
      }
    };

    window.__startEditGuru = (guruId) => {
      const found = state.guruList.find((x) => x.id === guruId);
      if (!found) return;
      state.editingGuru = { ...found };
      renderApp();
    };

    window.__cancelEditGuru = () => {
      state.editingGuru = null;
      renderApp();
    };

    window.__toggleGuruStatus = async (guruId, nextStatus) => {
      try {
        if (IS_PREVIEW) {
          const g = state.guruList.find((x) => x.id === guruId);
          if (g) {
            g.status_aktif = nextStatus;
            if (nextStatus) g.status_akun = "APPROVED";
          }
          showToast("Status akun guru diperbarui (Mode Preview).", "success");
          renderApp();
        } else {
          const upd = { status_aktif: nextStatus };
          if (nextStatus) upd.status_akun = "APPROVED";
          await updateDoc(doc(db, "guru_users", guruId), upd);
          showToast("Status akun guru diperbarui.", "success");
        }
      } catch (err) {
        showToast("Gagal memperbarui status: " + err.message, "error");
      }
    };

    window.__deleteGuru = async (guruId) => {
      try {
        if (IS_PREVIEW) {
          state.guruList = state.guruList.filter((x) => x.id !== guruId);
          if (state.editingGuru?.id === guruId) state.editingGuru = null;
          showToast("Akun guru dihapus (Mode Preview).", "info");
          renderApp();
        } else {
          await deleteDoc(doc(db, "guru_users", guruId));
          if (state.editingGuru?.id === guruId) state.editingGuru = null;
          showToast("Akun guru dihapus dari Firestore.", "info");
        }
      } catch (err) {
        showToast("Gagal menghapus akun guru: " + err.message, "error");
      }
    };

    function bindFormListeners() {
      const guruLoginForm = document.getElementById("guru-login-form");
      if (guruLoginForm) {
        guruLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const u = document.getElementById("login-guru-user").value;
          const p = document.getElementById("login-guru-pass").value;
          handleGuruLogin(u, p);
        };
      }

      const guruRegisterForm = document.getElementById("guru-register-form");
      if (guruRegisterForm) {
        guruRegisterForm.onsubmit = (e) => {
          e.preventDefault();
          handleGuruRegister({
            nama_lengkap: document.getElementById("reg-guru-nama").value,
            jenjang: document.getElementById("reg-guru-jenjang").value,
            jenis_guru: document.getElementById("reg-guru-jenis").value,
            nip: document.getElementById("reg-guru-nip").value,
            mapel_utama: document.getElementById("reg-guru-mapel").value,
            username: document.getElementById("reg-guru-user").value,
            password: document.getElementById("reg-guru-pass").value
          });
        };
      }

      const adminLoginForm = document.getElementById("admin-login-form");
      if (adminLoginForm) {
        adminLoginForm.onsubmit = (e) => {
          e.preventDefault();
          const em = document.getElementById("login-admin-email").value;
          const ps = document.getElementById("login-admin-pass").value;
          handleAdminLogin(em, ps);
        };
      }

      const addGuruForm = document.getElementById("add-guru-form");
      if (addGuruForm) {
        addGuruForm.onsubmit = async (e) => {
          e.preventDefault();
          const nama = document.getElementById("new-guru-nama").value.trim();
          const username = document.getElementById("new-guru-user").value.trim().toLowerCase();
          const password = document.getElementById("new-guru-pass").value.trim();
          const jenjang = document.getElementById("new-guru-jenjang").value;
          const jenis_guru = document.getElementById("new-guru-jenis").value;
          const nip = document.getElementById("new-guru-nip").value.trim();
          const mapel = document.getElementById("new-guru-mapel").value.trim();
          if (!nama || !username || !password) return;

          try {
            if (IS_PREVIEW) {
              if (state.guruList.some((x) => x.username.toLowerCase() === username)) {
                throw new Error("Username sudah terdaftar.");
              }
              state.guruList.unshift({
                id: "guru-" + Date.now(),
                nama_lengkap: nama,
                username,
                password,
                jenjang,
                jenis_guru,
                nip,
                mapel_utama: mapel,
                status_akun: "APPROVED",
                status_aktif: true
              });
              showToast("Akun guru berhasil ditambahkan & aktif (Mode Preview).", "success");
              renderApp();
            } else {
              const qCheck = query(collection(db, "guru_users"), where("username", "==", username));
              const snapCheck = await getDocs(qCheck);
              if (!snapCheck.empty) {
                throw new Error("Username sudah digunakan oleh akun lain.");
              }
              await addDoc(collection(db, "guru_users"), {
                nama_lengkap: nama,
                username,
                password,
                jenjang,
                jenis_guru,
                nip,
                mapel_utama: mapel,
                status_akun: "APPROVED",
                status_aktif: true,
                created_at: serverTimestamp()
              });
              showToast("Akun guru berhasil disimpan ke Firestore!", "success");
            }
          } catch (err) {
            showToast("Gagal menambahkan guru: " + err.message, "error");
          }
        };
      }

      const editGuruForm = document.getElementById("edit-guru-form");
      if (editGuruForm) {
        editGuruForm.onsubmit = async (e) => {
          e.preventDefault();
          const id = document.getElementById("edit-guru-id").value;
          const nama = document.getElementById("edit-guru-nama").value.trim();
          const username = document.getElementById("edit-guru-user").value.trim().toLowerCase();
          const password = document.getElementById("edit-guru-pass").value.trim();
          const jenjang = document.getElementById("edit-guru-jenjang").value;
          const jenis_guru = document.getElementById("edit-guru-jenis").value;
          const nip = document.getElementById("edit-guru-nip").value.trim();
          const mapel = document.getElementById("edit-guru-mapel").value.trim();
          if (!id || !nama || !username || !password) return;

          try {
            if (IS_PREVIEW) {
              const idx = state.guruList.findIndex((x) => x.id === id);
              if (idx !== -1) {
                state.guruList[idx] = {
                  ...state.guruList[idx],
                  nama_lengkap: nama,
                  username,
                  password,
                  jenjang,
                  jenis_guru,
                  nip,
                  mapel_utama: mapel
                };
              }
              state.editingGuru = null;
              showToast("Perubahan akun guru berhasil disimpan (Mode Preview).", "success");
              renderApp();
            } else {
              await updateDoc(doc(db, "guru_users", id), {
                nama_lengkap: nama,
                username,
                password,
                jenjang,
                jenis_guru,
                nip,
                mapel_utama: mapel
              });
              state.editingGuru = null;
              showToast("Perubahan akun guru berhasil diperbarui di Firestore!", "success");
              renderApp();
            }
          } catch (err) {
            showToast("Gagal memperbarui akun guru: " + err.message, "error");
          }
        };
      }

      const madrasahForm = document.getElementById("madrasah-settings-form");
      if (madrasahForm) {
        madrasahForm.onsubmit = async (e) => {
          e.preventDefault();
          const updated = {
            nama_madrasah: document.getElementById("set-nama-madrasah").value.trim(),
            nsm: document.getElementById("set-nsm").value.trim(),
            npsn: document.getElementById("set-npsn").value.trim(),
            tahun_pelajaran: document.getElementById("set-tapel").value.trim(),
            alamat: document.getElementById("set-alamat").value.trim(),
            nama_kepala: document.getElementById("set-kepala").value.trim(),
            nip_kepala: document.getElementById("set-nip-kepala").value.trim(),
            logo_kemenag_url: state.madrasah.logo_kemenag_url || "",
            logo_url: state.madrasah.logo_url || "",
            ttd_kepala_url: state.madrasah.ttd_kepala_url || "",
            ttd_penyusun_url: state.userTtdUrl || state.madrasah.ttd_penyusun_url || "",
            admin_profile: state.adminProfile
          };
          try {
            if (IS_PREVIEW) {
              state.madrasah = updated;
              showToast("Profil, Logo Kemenag/Madrasah & TTD diperbarui (Mode Preview).", "success");
              renderApp();
            } else {
              await setDoc(doc(db, "pengaturan_madrasah", "profil_utama"), updated, { merge: true });
              state.madrasah = updated;
              showToast("Profil, Logo Kemenag/Madrasah & TTD disimpan ke Firestore!", "success");
            }
          } catch (err) {
            showToast("Gagal menyimpan profil: " + err.message, "error");
          }
        };
      }

      const adminProfileForm = document.getElementById("admin-profile-form");
      if (adminProfileForm) {
        adminProfileForm.onsubmit = async (e) => {
          e.preventDefault();
          const updatedAdmin = {
            nama_admin: document.getElementById("adm-nama").value.trim(),
            jabatan_admin: document.getElementById("adm-jabatan").value.trim(),
            email_admin: document.getElementById("adm-email").value.trim(),
            whatsapp_admin: document.getElementById("adm-whatsapp").value.trim(),
            bank_nama: document.getElementById("adm-bank-nama").value.trim(),
            bank_rekening: document.getElementById("adm-bank-rekening").value.trim(),
            bank_atas_nama: document.getElementById("adm-bank-an").value.trim(),
            biaya_aktivasi: document.getElementById("adm-biaya").value.trim(),
            catatan_pembayaran: document.getElementById("adm-catatan").value.trim()
          };
          try {
            state.adminProfile = updatedAdmin;
            if (state.user?.role === "ADMIN" && updatedAdmin.nama_admin) {
              state.user.nama = updatedAdmin.nama_admin;
            }
            if (IS_PREVIEW) {
              state.madrasah.admin_profile = updatedAdmin;
              showToast("Data pribadi Admin & Rekening berhasil diperbarui (Mode Preview)!", "success");
              renderApp();
            } else {
              await setDoc(
                doc(db, "pengaturan_madrasah", "profil_utama"),
                { admin_profile: updatedAdmin },
                { merge: true }
              );
              state.madrasah.admin_profile = updatedAdmin;
              showToast("Data pribadi Admin & Rekening berhasil disimpan ke Firestore!", "success");
              renderApp();
            }
          } catch (err) {
            showToast("Gagal menyimpan data Admin: " + err.message, "error");
          }
        };
      }
    }

    function renderApp() {
      const root = document.getElementById("app-root");
      if (!root) return;

      if (state.restoringSession) {
        root.innerHTML = `
          <div class="min-h-screen w-full flex items-center justify-center p-6 bg-[#EEF1F6]">
            <div class="neu-surface rounded-3xl p-8 text-center space-y-3 max-w-xs w-full">
              <div class="w-12 h-12 rounded-2xl brand-gradient text-white flex items-center justify-center mx-auto animate-pulse">
                <i data-lucide="loader-2" class="w-6 h-6 animate-spin"></i>
              </div>
              <div class="text-sm font-extrabold text-slate-800">Memulihkan Sesi...</div>
              <p class="text-xs text-slate-400">Menghubungkan kembali akun Anda</p>
            </div>
          </div>
        `;
      } else if (!state.selectedTrack) {
        root.innerHTML = renderTrackSelectionGate();
      } else if (!state.user) {
        root.innerHTML = renderLoginScreen();
      } else {
        root.innerHTML = renderWorkspace();
      }

      bindFormListeners();
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // Pulihkan sesi (jika halaman di-refresh) lalu render tampilan awal
    restoreSessionOnLoad();
    renderApp();
  </script>
</body>
</html>
