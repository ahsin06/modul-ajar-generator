    // =========================================================================
    // PERSISTENSI SESI AKTIF (AGAR TIDAK KELUAR SAAT REFRESH)
    // =========================================================================
    const SESSION_KEY = 'klikajar_active_session_v2';

    function saveSessionState() {
      try {
        if (state.currentUser) {
          const payload = {
            currentUser: state.currentUser,
            currentView: state.currentView,
            activeMenu: state.activeMenu,
            institutionData: state.institutionData,
            adminPaymentConfig: state.adminPaymentConfig
          };
          sessionStorage.setItem(SESSION_KEY, JSON.stringify(payload));
          localStorage.setItem(SESSION_KEY, JSON.stringify(payload));
        } else {
          sessionStorage.removeItem(SESSION_KEY);
          localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {}
    }

    function restoreSessionState() {
      try {
        const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.currentUser) {
            state.currentUser = parsed.currentUser;
            state.currentView = parsed.currentView || 'app';
            state.activeMenu = parsed.activeMenu || 'dashboard';
            if (parsed.institutionData) {
              state.institutionData = { ...state.institutionData, ...parsed.institutionData };
            }
            if (parsed.adminPaymentConfig) {
              state.adminPaymentConfig = { ...state.adminPaymentConfig, ...parsed.adminPaymentConfig };
            }
            state.genForm.namaGuru = parsed.currentUser.namaLengkap || state.genForm.namaGuru;
            syncInstitutionToGenForm();
            return true;
          }
        }
      } catch (e) {}
      return false;
    }

    function showToast(msg, type = 'success') {
      state.toastMessage = { msg, type };
      renderApp();
      setTimeout(() => {
        state.toastMessage = null;
        renderApp();
      }, 3600);
    }

    function formatTanggalIndo(isoDate) {
      if (!isoDate) return '';
      try {
        const d = new Date(isoDate + 'T00:00:00');
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      } catch (e) {
        return isoDate;
      }
    }

    function syncInstitutionToGenForm() {
      const inst = state.institutionData;
      state.genForm.naungan = inst.naungan;
      state.genForm.jenisInstitusi = inst.naungan === 'Kemenag' ? 'Madrasah' : 'Sekolah Umum';

    function getAccessibleDocuments() {
      if (!state.currentUser) return [];
      if (state.currentUser.role === 'admin') {
        return state.documents;

      return state.documents.filter(d => d.userId === state.currentUser.id);
    }

      return form.naungan === 'Kemenag' || form.jenisInstitusi === 'Madrasah' || ['RA', 'MI', 'MTs', 'MA'].includes(form.jenjang);

    // =========================================================================
    let fbAuth = null;
    let fbDb = null;
    let fbMod = null;

    async function initFirebaseIfProduction() {
      if (IS_PREVIEW) return;
      try {
        const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
        const authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
        const fsMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
        const app = appMod.initializeApp(firebaseConfig);
        fbAuth = authMod.getAuth(app);
        fbDb = fsMod.getFirestore(app);
        fbMod = { ...authMod, ...fsMod };

        await loadPublicAdminPaymentConfig();
        if (state.currentUser) {
          await loadFirestoreDataForRole();
          renderApp();
        }
      } catch (err) {
        console.error('Firebase init error:', err);
      }
    }

    async function loadPublicAdminPaymentConfig() {
      if (IS_PREVIEW || !fbDb || !fbMod) return;
      try {
        const snap = await fbMod.getDoc(fbMod.doc(fbDb, 'app_settings', 'admin_payment'));
        if (snap.exists()) {
          state.adminPaymentConfig = { ...state.adminPaymentConfig, ...snap.data() };
        }
      } catch (err) {}
    }

    async function loadFirestoreDataForRole() {
      if (IS_PREVIEW || !fbDb || !fbMod || !state.currentUser) return;
      try {
        const docsSnap = await fbMod.getDocs(fbMod.collection(fbDb, 'documents'));
        const allDocs = docsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        state.documents = state.currentUser.role === 'admin'
          ? allDocs
          : allDocs.filter(d => d.userId === state.currentUser.id);

        if (state.currentUser.role === 'admin') {
          const usersSnap = await fbMod.getDocs(fbMod.collection(fbDb, 'users'));
          state.usersList = usersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
        }
      } catch (err) {
        console.error('Error memuat data Firestore:', err);
      }
    }

      const roleTab = state.authTab;

      if (roleTab === 'admin') {
        const email = (fd.get('email') || '').toString().trim();
        const password = (fd.get('password') || '').toString().trim();

          showToast('Masukkan email dan password Admin.', 'error');
          return;

          state.currentUser = {
            id: 'admin-klikajar-1',

            role: 'admin',
            namaInstitusi: 'Pusat Kendali KlikAjar'
          };
          state.currentView = 'app';
          state.activeMenu = 'dashboard';
          saveSessionState();
          showToast('Berhasil masuk sebagai Super Admin KlikAjar!');
          renderApp();
        } else {
          try {
            const cred = await fbMod.signInWithEmailAndPassword(fbAuth, email, password);

              id: cred.user.uid,
              namaLengkap: state.adminPaymentConfig.namaAdmin || 'Administrator KlikAjar',
              email: cred.user.email,
              role: 'admin',
              namaInstitusi: 'Pusat Kendali KlikAjar'

            state.currentView = 'app';
            state.activeMenu = 'dashboard';

          }
        }

        const username = (fd.get('username') || '').toString().trim();
        const password = (fd.get('password') || '').toString().trim();
        if (!username || !password) {
          showToast('Masukkan Username/NIP dan Password.', 'error');
          return;
        }

        if (IS_PREVIEW) {
          const found = state.usersList.find(u => (u.username === username || u.nip === username) && u.password === password);

            showToast('Akun tidak ditemukan atau password salah. Silakan daftar terlebih dahulu.', 'error');

            return;
          }
          state.currentUser = { ...found };
          state.genForm.namaGuru = found.namaLengkap;
          state.genForm.namaInstitusi = found.namaInstitusi || state.genForm.namaInstitusi;
          state.currentView = 'app';
          state.activeMenu = 'dashboard';
          saveSessionState();
          showToast(`Selamat datang kembali, ${found.namaLengkap}!`);

      if (menuId === 'dashboard') return 'Dashboard Studio Pembelajaran KlikAjar';
      if (menuId === 'generator') return 'Generator Perangkat Pembelajaran AI';
      if (menuId === 'editor') return 'Editor Dokumen & Pratinjau Cetak A4';
      if (menuId === 'documents') return 'Arsip Perangkat Pembelajaran';
      if (menuId === 'institution') return 'Data Instansi (Diknas / Kemenag) & Identitas Lembaga';
      if (menuId === 'calendar') return 'Kalender Pendidikan Satuan Pendidikan';
      if (menuId === 'templates') return 'Pustaka Template & Desain Dokumen';
      if (menuId === 'users') return 'Kontrol Semua Akun Guru & Konfirmasi Pembayaran';
      if (menuId === 'admin-profile') return 'Profil Admin & Pengaturan Rekening Pembayaran';
      if (menuId === 'profile') return 'Profil Guru & Identitas Institusi';
      if (menuId === 'settings') return 'Pengaturan AI Provider & Preferensi Sistem';
      const dev = DEVICE_TYPES.find(d => d.id === menuId);
      return dev ? `Generator ${dev.name}` : 'KlikAjar';
    }

                  <div class="col-span-2 lg:col-span-1">
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Fase</label>
                    <select onchange="window.updateGenForm('fase', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">
                      ${FASE_LIST.map(fa => `<option value="${fa}" ${f.fase === fa ? 'selected' : ''}>${fa}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Kelas</label>
                    <input type="text" value="${f.kelas}" oninput="window.updateGenForm('kelas', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Semester</label>
                    <select onchange="window.updateGenForm('semester', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">
                      <option value="Ganjil" ${f.semester === 'Ganjil' ? 'selected' : ''}>Ganjil</option>
                      <option value="Genap" ${f.semester === 'Genap' ? 'selected' : ''}>Genap</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Tahun Ajaran</label>
                    <input type="text" value="${f.tahunAjaran}" oninput="window.updateGenForm('tahunAjaran', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                </div>

                <!-- GURU & MATA PELAJARAN -->
                <div class="grid sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Nama Guru Penyusun</label>
                    <input type="text" value="${f.namaGuru}" oninput="window.updateGenForm('namaGuru', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">NIP Guru (Opsional)</label>
                    <input type="text" value="${f.nipGuru || ''}" oninput="window.updateGenForm('nipGuru', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Mata Pelajaran</label>
                    <select onchange="window.updateGenForm('mataPelajaran', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">
                      ${mapelOptions.map(mp => `<option value="${mp}" ${f.mataPelajaran === mp ? 'selected' : ''}>${mp}</option>`).join('')}
                    </select>
                  </div>
                </div>

                <!-- MATERI POKOK, SUBMATERI, TOPIK, ALOKASI WAKTU -->
                <div class="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Materi Pokok / Bab *</label>
                    <input type="text" value="${f.materiPokok}" oninput="window.updateGenForm('materiPokok', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs font-semibold" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Submateri</label>
                    <input type="text" value="${f.submateri}" oninput="window.updateGenForm('submateri', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                </div>

                <div class="grid sm:grid-cols-3 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Topik Pembelajaran</label>
                    <input type="text" value="${f.topikPembelajaran}" oninput="window.updateGenForm('topikPembelajaran', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Model Pembelajaran</label>
                    <select onchange="window.updateGenForm('modelPembelajaran', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">
                      ${['Problem Based Learning (PBL)', 'Project Based Learning (PjBL)', 'Discovery Learning', 'Inquiry Learning', 'Cooperative Learning', 'Differentiated Instruction'].map(md => `<option value="${md}" ${f.modelPembelajaran === md ? 'selected' : ''}>${md}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Alokasi Waktu</label>
                    <input type="text" value="${f.alokasiWaktu}" oninput="window.updateGenForm('alokasiWaktu', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs" />
                  </div>
                </div>

                <div class="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Karakteristik Peserta Didik</label>
                    <textarea rows="2" oninput="window.updateGenForm('karakteristikSiswa', this.value)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">${f.karakteristikSiswa}</textarea>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5">Sarana dan Prasarana</label>
                    <textarea rows="2" oninput="window.updateGenForm('saranaPrasarana', this.value)" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-xs">${f.saranaPrasarana}</textarea>
                  </div>
                </div>

                <!-- PANEL INTEGRASI PANCA CINTA (HANYA TAMPIL JIKA MEMILIH KURIKULUM BERBASIS CINTA) -->
                ${f.kurikulum === 'Kurikulum Berbasis Cinta (Panca Cinta)' ? `
                  <div class="p-4 sm:p-5 rounded-2xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 space-y-3">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                      <div class="flex items-center gap-2">
                        <i data-lucide="heart" class="w-4 h-4 text-amber-600"></i>
                        <span class="font-display font-bold text-sm text-slate-900 dark:text-white">Pengaturan Nilai Panca Cinta</span>
                      </div>
                      <select onchange="window.updateGenForm('pancaCintaMode', this.value)" class="px-3 py-1.5 rounded-lg border border-amber-300 dark:border-amber-700 bg-white dark:bg-slate-800 text-xs font-semibold">
                        <option value="otomatis" ${f.pancaCintaMode === 'otomatis' ? 'selected' : ''}>Integrasi Otomatis (Semua 5 Nilai)</option>
                        <option value="manual" ${f.pancaCintaMode === 'manual' ? 'selected' : ''}>Pilih Manual Nilai Panca Cinta</option>
                      </select>
                    </div>

                    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-2.5 pt-1">
                      ${PANCA_CINTA_ITEMS.map(pc => {
                        const checked = f.pancaCintaMode === 'otomatis' || f.pancaCintaSelected.includes(pc.id);
                        return `
                          <label class="flex items-start gap-2 p-2.5 rounded-xl bg-white dark:bg-darkCard border border-amber-100 dark:border-slate-700 text-xs cursor-pointer">
                            <input type="checkbox" ${checked ? 'checked' : ''} ${f.pancaCintaMode === 'otomatis' ? 'disabled' : ''}
                              onchange="window.togglePancaCintaItem('${pc.id}')" class="mt-0.5 accent-amber-600" />
                            <span><strong>${pc.title}</strong></span>
                          </label>
                        `;
                      }).join('')}
                    </div>
                  </div>
                ` : ''}

                <!-- TOMBOL GENERATE UTAMA -->
                <div class="pt-2 flex flex-wrap items-center gap-3">
                  <button onclick="window.runGenerateDocument()" ${state.isGenerating ? 'disabled' : ''}
                    class="px-7 py-3.5 rounded-2xl bg-emeraldDeep hover:bg-teal-800 text-white font-display font-extrabold text-xs sm:text-sm shadow-lg shadow-emerald-900/20 flex items-center gap-2.5 transition disabled:opacity-60">
                    <i data-lucide="${state.isGenerating ? 'loader-2' : 'sparkles'}" class="w-4 h-4 ${state.isGenerating ? 'animate-spin' : ''}"></i>
                    <span>${state.isGenerating ? 'AI Sedang Menyusun Perangkat...' : 'Generate Perangkat Pembelajaran Sekarang'}</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 3. EDITOR DOKUMEN & PRATINJAU CETAK A4
      if (m === 'editor') {
        if (!state.activeDoc) {
          return `
            <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-10 text-center space-y-4">
              <i data-lucide="file-text" class="w-12 h-12 text-slate-300 mx-auto"></i>
              <h3 class="font-display font-bold text-base">Belum Ada Dokumen Aktif di Editor</h3>
              <p class="text-xs text-slate-500 max-w-md mx-auto">Buat perangkat baru melalui Generator atau pilih salah satu dokumen dari arsip tersimpan.</p>
              <div class="flex justify-center gap-3">
                <button onclick="window.setActiveMenu('generator')" class="px-5 py-2.5 rounded-xl bg-emeraldDeep text-white text-xs font-bold">Buka Generator AI</button>
                <button onclick="window.setActiveMenu('documents')" class="px-5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold">Lihat Arsip</button>
              </div>
            </div>
          `;
        }

        const doc = state.activeDoc;
        const logoNaungan = doc.logoNaunganDataUrl || state.institutionData.logoNaunganDataUrl;
        const logoLembaga = doc.logoLembagaDataUrl || state.institutionData.logoLembagaDataUrl;
        const namaInstitusiDoc = doc.namaInstitusi || state.institutionData.namaLembaga;
        const naunganDoc = doc.naungan || state.institutionData.naungan;
        const npsnDoc = doc.npsn || state.institutionData.npsn;
        const nsmDoc = doc.nsm || state.institutionData.nsm;
        const alamatDoc = doc.alamatInstitusi || state.institutionData.alamat;
        const kotaDoc = doc.kotaKabupaten || state.institutionData.kotaKabupaten;
        const tglDoc = formatTanggalIndo(doc.tanggalPenyusunan || state.genForm.tanggalPenyusunan);
        const kepalaDoc = doc.namaKepala || state.institutionData.namaKepala;
        const nipKepalaDoc = doc.nipKepala || state.institutionData.nipKepala;

        return `
          <div class="space-y-4">
            <!-- TOOLBAR EDITOR & EXPORT -->
            <div class="no-print bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex flex-wrap items-center justify-between gap-3 sticky top-16 z-20 shadow-xs">
              <div class="flex flex-wrap items-center gap-2">
                <select onchange="window.changeDocTemplate(this.value)" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs font-bold">
                  ${DOC_TEMPLATES.map(t => `<option value="${t.id}" ${doc.templateStyle === t.id ? 'selected' : ''}>Tema: ${t.name}</option>`).join('')}
                </select>
                <button onclick="window.addCustomSection()" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Bagian
                </button>
                <button onclick="window.saveActiveDocChanges()" class="px-3.5 py-2 rounded-xl bg-emeraldDeep text-white text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="save" class="w-3.5 h-3.5"></i> Simpan
                </button>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                <button onclick="window.exportDocumentDOCX()" class="px-3.5 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Unduh Word (.doc)
                </button>
                <button onclick="window.exportDocumentPDF()" class="px-3.5 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="file-down" class="w-3.5 h-3.5"></i> Unduh PDF
                </button>
                <button onclick="window.print()" class="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold flex items-center gap-1.5">
                  <i data-lucide="printer" class="w-3.5 h-3.5"></i> Cetak A4
                </button>
              </div>
            </div>

            <!-- KERTAS A4 INTERAKTIF (EDITABLE) -->
            <div class="overflow-x-auto pb-8">
              <div id="printable-document-area" class="a4-paper ${doc.templateStyle || 'tpl-madrasah'}">
                <!-- KOP LEMBAGA & DUA LOGO (KEMENAG/KEMENDIKBUD & LOGO LEMBAGA) -->
                <div class="doc-banner mb-5">
                  <div class="flex items-center justify-between gap-4">
                    <div class="w-16 h-16 shrink-0 flex items-center justify-center">
                      ${logoNaungan
                        ? `<img src="${logoNaungan}" alt="Logo Instansi" class="max-h-16 max-w-16 object-contain" />`
                        : `<div class="w-14 h-14 rounded-xl border border-current/25 flex items-center justify-center text-[9px] font-bold text-center p-1 opacity-70">${naunganDoc === 'Kemenag' ? 'LOGO KEMENAG' : 'LOGO DIKNAS'}</div>`
                      }
                    </div>

                    <div class="flex-1 text-center">
                      <p class="text-[10px] uppercase tracking-wider font-bold opacity-85">
                        ${naunganDoc === 'Kemenag' ? 'KEMENTERIAN AGAMA REPUBLIK INDONESIA' : naunganDoc === 'Diknas' ? 'DINAS PENDIDIKAN / KEMENDIKBUDRISTEK' : 'SATUAN PENDIDIKAN'}
                      </p>
                      <h2 contenteditable="true" class="text-base font-extrabold uppercase tracking-tight leading-snug">
                        ${namaInstitusiDoc}
                      </h2>
                      <p class="text-[10px] opacity-90">
                        NPSN: ${npsnDoc || '-'}${naunganDoc === 'Kemenag' && nsmDoc ? ' • NSM: ' + nsmDoc : ''} • ${alamatDoc || ''}, ${kotaDoc || ''}
                      </p>
                      <div class="mt-2 pt-2 border-t border-current/20">
                        <p class="text-[10px] uppercase tracking-widest font-bold opacity-80">${doc.jenisLabel.toUpperCase()} — ${doc.kurikulum}</p>
                        <h1 contenteditable="true" onblur="window.updateDocTitle(this.innerText)" class="text-base font-extrabold mt-0.5 outline-none focus:ring-2 focus:ring-emerald-400 rounded px-1">
                          ${doc.judul}
                        </h1>
                        <p class="text-[11px] mt-0.5 opacity-90">
                          ${doc.jenjang} • ${doc.fase} • Kelas ${doc.kelas} • Semester ${doc.semester} (${doc.tahunAjaran})
                        </p>
                      </div>
                    </div>

                    <div class="w-16 h-16 shrink-0 flex items-center justify-center">
                      ${logoLembaga
                        ? `<img src="${logoLembaga}" alt="Logo Lembaga" class="max-h-16 max-w-16 object-contain" />`
                        : `<div class="w-14 h-14 rounded-xl border border-current/25 flex items-center justify-center text-[9px] font-bold text-center p-1 opacity-70">LOGO LEMBAGA</div>`
                      }
                    </div>
                  </div>
                </div>

                <!-- SEKSI DOKUMEN EDITABLE -->
                <div class="space-y-5">
                  ${doc.sections.map(sec => `
                    <div class="group relative">
                      <div class="flex items-center justify-between gap-2 mb-1.5">
                        <h3 contenteditable="true" onblur="window.updateSectionTitle('${sec.id}', this.innerText)"
                          class="font-display font-bold text-sm text-emeraldDeep outline-none focus:bg-emerald-50 rounded px-1">
                          ${sec.title}
                        </h3>
                        <button onclick="window.removeSection('${sec.id}')" title="Hapus Bagian"
                          class="no-print opacity-0 group-hover:opacity-100 text-[10px] text-rose-500 hover:underline px-2 py-0.5">
                          Hapus
                        </button>
                      </div>
                      <div contenteditable="true" onblur="window.updateSectionContent('${sec.id}', this.innerHTML)"
                        class="outline-none focus:ring-1 focus:ring-emerald-300 rounded p-1">
                        ${sec.content}
                      </div>
                    </div>
                  `).join('')}
                </div>

                <!-- TANDA TANGAN PENGESAHAN DENGAN KOTA/KABUPATEN & TANGGAL PENYUSUNAN -->
                <div class="mt-10 pt-6 border-t border-slate-200 grid grid-cols-2 gap-8 text-xs">
                  <div>
                    <p>Mengetahui,</p>
                    <p>Kepala Sekolah / Madrasah</p>
                    <div class="h-16"></div>
                    <p class="font-bold underline" contenteditable="true">${kepalaDoc || '......................................................'}</p>
                    <p contenteditable="true">NIP. ${nipKepalaDoc || '...........................................'}</p>
                  </div>
                  <div>
                    <p contenteditable="true">${kotaDoc || '....................'}, ${tglDoc || '....................'}</p>
                    <p>Guru Mata Pelajaran</p>
                    <div class="h-16"></div>
                    <p class="font-bold underline" contenteditable="true">${doc.namaGuru || state.genForm.namaGuru}</p>
                    <p contenteditable="true">NIP. ${doc.nipGuru || user?.nip || '...........................................'}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // 4. ARSIP PERANGKAT TERSIMPAN (TERISOLASI PER AKUN, ADMIN AKSES SEMUA)
      if (m === 'documents') {
        const filtered = docs.filter(d => {
          const matchSearch = !state.searchQuery ||
            d.judul.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
            d.mataPelajaran.toLowerCase().includes(state.searchQuery.toLowerCase());
          const matchType = state.docFilterType === 'all' || d.jenisPerangkat === state.docFilterType;
          return matchSearch && matchType;
        });

        return `
          <div class="space-y-5">
            <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-4 flex flex-col sm:flex-row gap-3 justify-between">
              <input type="text" value="${state.searchQuery}" oninput="state.searchQuery = this.value; window.renderApp();"
                placeholder="Cari judul perangkat atau mata pelajaran..."
                class="flex-1 px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs" />
              <select onchange="state.docFilterType = this.value; window.renderApp();"
                class="px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 text-xs font-semibold">
                <option value="all">Semua Jenis Perangkat</option>
                ${DEVICE_TYPES.map(d => `<option value="${d.id}" ${state.docFilterType === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
              </select>
            </div>

            ${filtered.length === 0 ? `
              <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-10 text-center text-xs text-slate-500">
                Tidak ada dokumen yang sesuai filter saat ini.
              </div>
            ` : `
              <div class="grid md:grid-cols-2 gap-4">
                ${filtered.map(d => `
                  <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-5 flex flex-col justify-between gap-4">
                    <div>
                      <div class="flex items-center justify-between gap-2 mb-2">
                        <span class="px-2.5 py-0.5 rounded-full bg-mintSoft text-emeraldDeep text-[10px] font-bold">${d.jenisLabel}</span>
                        <span class="text-[10px] text-slate-400">${d.kurikulum}</span>
                      </div>
                      <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white">${d.judul}</h3>
                      <p class="text-xs text-slate-500 mt-1">${d.namaInstitusi} • ${d.jenjang} Kelas ${d.kelas}</p>
                      ${isAdmin ? `<p class="text-[11px] text-amber-600 font-semibold mt-1">Pemilik Akun: ${d.ownerName || d.userId}</p>` : ''}
                    </div>
                    <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                      <button onclick="window.openDocInEditor('${d.id}')" class="px-3.5 py-1.5 rounded-xl bg-emeraldDeep text-white text-xs font-bold">Buka & Edit</button>
                      <button onclick="window.duplicateDocument('${d.id}')" class="px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-semibold">Duplikat</button>
                      <button onclick="window.deleteDocument('${d.id}')" class="px-3 py-1.5 rounded-xl text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 text-xs font-semibold ml-auto">Hapus</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }

      // 4B. MENU DATA INSTANSI (NAUNGAN DIKNAS / KEMENAG) & DATA LEMBAGA + UPLOAD LOGO
      if (m === 'institution') {
        const inst = state.institutionData;
        return `
          <div class="max-w-4xl space-y-6">
            <div class="bg-white dark:bg-darkCard rounded-2xl border border-slate-200 dark:border-slate-700 p-6 sm:p-8 shadow-xs">
              <div class="border-b border-slate-200 dark:border-slate-700 pb-4 mb-6">
                <h3 class="font-display text-lg font-extrabold text-slate-900 dark:text-white">Data Instansi Naungan & Identitas Madrasah / Sekolah</h3>
                <p class="text-xs text-slate-500 mt-1">Data ini otomatis menjadi Kop Surat resmi pada seluruh dokumen perangkat pembelajaran (Modul Ajar, LKPD, Asesmen, ATP, Prota/Promes) dan terisi otomatis pada form generator.</p>
              </div>

              <form onsubmit="window.saveInstitutionData(event)" class="space-y-5 text-xs">
                <div class="grid sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block font-bold mb-1.5">Instansi Naungan (Opsional)</label>
                    <select name="naungan" onchange="window.updateInstitutionField('naungan', this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-bgLight dark:bg-slate-800 font-semibold">
                      <option value="Kemenag" ${inst.naungan === 'Kemenag' ? 'selected' : ''}>Kementerian Agama (Kemenag)</option>

    // =========================================================================
    // RENDER ROOT & BOOTSTRAP APLIKASI
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('klikajar-root');
      if (!root) return;

      let content = '';
      if (state.currentView === 'landing') {
        content = renderLandingPage();
      } else if (state.currentView === 'login' || state.currentView === 'register') {
        content = renderAuthPage(state.currentView);
      } else {
        if (!state.currentUser) {
          state.currentView = 'login';
          content = renderAuthPage('login');
        } else {
          content = renderWorkspace();
        }
      }

      const toastHTML = state.toastMessage ? `
        <div class="fixed bottom-5 right-5 z-[99999] max-w-sm px-4 py-3 rounded-2xl shadow-xl text-xs font-bold text-white flex items-center gap-2.5
          ${state.toastMessage.type === 'error' ? 'bg-rose-600' : 'bg-emeraldDeep'}">
          <i data-lucide="${state.toastMessage.type === 'error' ? 'alert-circle' : 'check-circle-2'}" class="w-4 h-4 shrink-0"></i>
          <span>${state.toastMessage.msg}</span>
        </div>
      ` : '';

      root.innerHTML = content + toastHTML;

      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    window.state = state;
    window.renderApp = renderApp;

    // Pulihkan sesi sebelum render pertama agar tidak keluar saat halaman di-refresh
    restoreSessionState();
    initFirebaseIfProduction();
    renderApp();
  </script>
</body>
</html>
